<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning · CHPG Monaco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root {
  --red: #CE1126;
  --red-soft: #F8E8EB;
  --amber: #D97706;
  --amber-soft: #FEF3C7;
  --ink: #0F172A;
  --ink-2: #334155;
  --ink-3: #64748B;
  --ink-4: #94A3B8;
  --line: #E2E8F0;
  --line-light: #F1F5F9;
  --bg: #F8FAFC;
  --white: #FFFFFF;
  --radius: 12px;
  --mono: 'DM Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.header {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
  position: sticky;
  top: 0;
  z-index: 300;
}
.header-brand { display: flex; align-items: center; gap: 14px; }
.header-flag {
  display: flex; flex-direction: column; width: 28px; height: 28px; border-radius: 6px;
  overflow: hidden; flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.flag-top { flex: 1; background: var(--red); }
.flag-bottom { flex: 1; background: var(--white); border-top: 1px solid var(--line); }
.header-title { font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
.header-sub { font-size: 11px; color: var(--ink-4); margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 8px; }

/* ── SÉLECTEURS ── */
.year-select {
  border: 1.5px solid var(--red); border-radius: 8px; padding: 6px 10px;
  font-size: 13px; font-weight: 700; font-family: 'DM Sans', sans-serif;
  color: var(--red); background: var(--white); outline: none; cursor: pointer;
  transition: border-color .15s, background .15s;
  min-width: 82px;
}
.year-select:focus { background: var(--red-soft); }
.month-select {
  border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 10px;
  font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif;
  color: var(--ink); background: var(--white); outline: none; cursor: pointer; transition: border-color .15s;
}
.month-select:focus { border-color: var(--red); }

/* ── VIEW TOGGLE ── */
.view-toggle-main {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding: 8px 32px;
  display: flex;
  gap: 4px;
}
.view-main-btn {
  border: 1.5px solid var(--line);
  background: var(--white);
  border-radius: 8px;
  padding: 6px 16px;
  font-size: 13px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  color: var(--ink-3);
  cursor: pointer;
  transition: all .15s;
}
.view-main-btn:hover { border-color: var(--red); color: var(--red); }
.view-main-btn.active { background: var(--red); border-color: var(--red); color: var(--white); }

/* ── WEEK NAV ── */
.week-nav {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding: 10px 32px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.nav-label { font-size: 11px; font-weight: 600; color: var(--ink-4); text-transform: uppercase; letter-spacing: .06em; }
.week-pills { display: flex; gap: 4px; flex-wrap: wrap; }
.week-pill {
  border: 1.5px solid var(--line); background: var(--white); border-radius: 8px;
  padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--ink-3);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.week-pill:hover { border-color: var(--red); color: var(--red); }
.week-pill.active { background: var(--red); border-color: var(--red); color: var(--white); }
.nav-divider { width: 1px; height: 20px; background: var(--line); flex-shrink: 0; }
.btn-today {
  border: 1.5px solid var(--line); background: var(--white); border-radius: 8px;
  padding: 5px 12px; font-size: 12px; font-weight: 600; font-family: 'DM Sans', sans-serif;
  color: var(--ink-2); cursor: pointer; transition: all .15s;
}
.btn-today:hover { border-color: var(--red); color: var(--red); }


/* ── TABLE ── */
.table-container { padding: 20px 32px; overflow-x: auto; border-radius: var(--radius); }
.planning-table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
  min-width: 900px; box-shadow: 0 1px 4px rgba(0,0,0,.05);
}

/* ── TABLE HEADER ── */
.th-sector {
  width: 180px; min-width: 160px; padding: 12px 16px; text-align: left;
  font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-3); background: var(--line-light); border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line); position: sticky; left: 0; z-index: 10;
}
.th-day {
  padding: 10px 6px 6px; text-align: center; background: var(--white);
  border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
  vertical-align: top; min-width: 100px; max-width: 100px; width: 100px;
}
.th-day:last-child { border-right: none; }
.th-day.weekend { background: var(--line-light); }
.th-day.today { background: #FFF5F5; }
.day-name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 1px; }
.day-date { font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1; margin-bottom: 6px; }
.th-day.today .day-date { color: var(--red); }
.th-day.weekend .day-date { color: var(--ink-4); }
.am-pm-labels { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-top: 4px; }
.am-pm-label {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  color: var(--white); background: var(--red); border-radius: 4px; padding: 2px 0; text-align: center;
}
.am-pm-label.pm { background: var(--ink-3); }
.th-day.weekend .am-pm-label, .th-day.weekend .am-pm-label.pm { background: var(--ink-4); }

/* ── TABLE ROWS ── */
.sector-row { border-bottom: 1px solid var(--line); }
.sector-row:last-child { border-bottom: none; }
.td-sector {
  padding: 0 10px; background: var(--line-light); border-right: 1px solid var(--line);
  vertical-align: middle; height: 56px; position: sticky; left: 0; z-index: 5; overflow: visible;
}
.sector-label { display: flex; align-items: center; gap: 8px; overflow: visible; }
.sector-icon-svg {
  width: 18px; height: 18px; flex-shrink: 0;
  stroke: var(--ink-3); stroke-width: 1.5; fill: none; display: block;
}
.sector-name-text { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.2; }

/* ── SLOT CELLS ── */
.td-day {
  border-right: 1px solid var(--line); padding: 0; vertical-align: top; height: 56px;
}
.td-day:last-child { border-right: none; }
.td-day.weekend { background: var(--line-light); }
.td-day.today { background: #FFF8F8; }
.slot-pair { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
.slot {
  padding: 4px 3px; display: grid; grid-template-columns: 1fr 1fr;
  gap: 2px; align-content: start; border-right: 1px solid var(--line-light);
  min-height: 56px; flex: 1; overflow: hidden;
}
.slot:last-child { border-right: none; }
.slot-name {
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; font-family: var(--mono);
  padding: 2px 4px; border-radius: 5px; background: #F1F5F9;
  color: var(--ink-2); cursor: default; white-space: nowrap;
  max-width: 44px; overflow: hidden; text-overflow: ellipsis;
}
.slot-name-spacer { display: inline-flex; width: 44px; visibility: hidden; }
.chip-guard { background: #EFF6FF; color: #1D4ED8; }
.chip-h18   { background: #F0FDF4; color: #166534; }
.slot-dash { color: var(--ink-4); font-size: 12px; text-align: center; margin-top: 4px; }

/* ── BOTTOM TABLES ── */
.bottom-tables { padding: 0 32px 32px; }
.bt-card {
  background: var(--white); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.bt-card-header {
  padding: 10px 16px; font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--ink-4); background: var(--line-light); border-bottom: 1px solid var(--line);
}
.bt-scroll { overflow-x: auto; }
.bt-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 900px; table-layout: fixed; }
.bt-label {
  width: 180px; min-width: 160px; max-width: 180px; padding: 8px 16px;
  font-size: 11px; font-weight: 600; color: var(--ink-3); background: var(--line-light);
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  vertical-align: middle; position: sticky; left: 0; z-index: 5;
}
.bt-table tr:last-child .bt-label, .bt-table tr:last-child .bt-cell { border-bottom: none; }
.bt-cell {
  padding: 5px 4px; text-align: center; border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line); vertical-align: top;
  width: 100px; min-width: 100px; max-width: 100px;
}
.bt-cell:last-child { border-right: none; }
.bt-cell.weekend { background: var(--line-light); }
.bt-dash { color: var(--ink-4); font-size: 12px; }
.name-tag {
  font-size: 10px; font-weight: 600; font-family: var(--mono);
  padding: 2px 5px; border-radius: 5px; background: var(--line-light);
  color: var(--ink-2); display: inline-flex; margin: 1px;
}
.name-tag.guard  { background: #EFF6FF; color: #1D4ED8; }
.name-tag.h18    { background: #F0FDF4; color: #166534; }
.name-tag.rg     { background: #F5F3FF; color: #6D28D9; }
.name-tag.absent { background: #F9FAFB; color: #6B7280; border: 1px solid #E5E7EB; }

/* ── VUE MÉDECINS ── */
.med-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  padding: 20px 32px;
}
.med-card {
  position: relative; display: flex; flex-direction: column;
  background: var(--white); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px 14px 12px; cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  box-shadow: 0 1px 3px rgba(0,0,0,.05); overflow: hidden;
}
.med-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.1); }
.med-accent { position: absolute; top: 0; left: 0; bottom: 0; width: 4px; }
.med-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.med-avatar {
  width: 40px; height: 40px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; font-family: var(--mono);
  flex-shrink: 0;
}
.med-name { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.15; }
.med-role { font-size: 10px; color: var(--ink-4); margin-top: 1px; }
.med-sector-badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 6px; font-size: 10.5px; font-weight: 700;
  font-family: var(--mono); align-self: flex-start;
}
.med-statline {
  display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px;
  padding-top: 10px; border-top: 1px solid var(--line-light);
  font-size: 11px; font-weight: 600; color: var(--ink-3);
}
.med-statline b { color: var(--ink); font-weight: 800; }
.med-foot { display: flex; align-items: center; gap: 6px; margin-top: 9px; font-size: 11px; color: var(--ink-3); }
.med-foot-yr { font-family: var(--mono); font-weight: 800; color: var(--red); font-size: 13px; }
.med-inactive { opacity: .45; }

/* ── Vue Équité ── */
.eq-wrap { padding: 4px 0 24px; }
.eq-summary { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
.eq-kpi { flex:1; min-width:110px; background:var(--white); border:1px solid var(--line); border-radius:12px; padding:12px 14px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.eq-kpi-num { font-family:var(--mono); font-size:20px; font-weight:800; color:var(--ink); line-height:1; }
.eq-kpi-lbl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-4); margin-top:5px; }
.eq-mean-legend { font-size:11px; color:var(--ink-3); margin-bottom:10px; display:flex; align-items:center; gap:6px; line-height:1.4; }
.eq-mean-legend .tick { display:inline-block; width:2px; height:13px; background:var(--ink); opacity:.55; flex-shrink:0; }
.eq-row { display:grid; grid-template-columns:140px 1fr 38px; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--line-light); }
.eq-row:last-child { border-bottom:none; }
.eq-who { display:flex; align-items:center; gap:8px; min-width:0; }
.eq-av { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; font-family:var(--mono); flex-shrink:0; background:#FEE2E2; color:#B91C1C; }
.eq-nm { font-size:12px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eq-bar { display:flex; flex-direction:column; gap:3px; min-width:0; }
.eq-track { position:relative; height:20px; background:var(--line-light); border-radius:6px; overflow:hidden; }
.eq-fill { position:absolute; top:0; left:0; bottom:0; background:linear-gradient(90deg,#F87171,#CE1126); border-radius:6px; min-width:2px; }
.eq-mean { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink); opacity:.55; }
.eq-axes { font-size:10.5px; color:var(--ink-3); font-weight:600; }
.eq-axes b { color:var(--ink-2); font-weight:800; }
.eq-total { font-family:var(--mono); font-size:14px; font-weight:800; color:var(--ink); text-align:right; }
@media (max-width:768px){ .eq-row { grid-template-columns:84px 1fr 32px; gap:8px; } .eq-av{ display:none; } .eq-nm{ font-size:11px; } }

/* ── Vue Affectations ── */
.aff-wrap { padding: 4px 0 24px; overflow-x: auto; }
.aff-legend { display:flex; flex-wrap:wrap; gap:6px 12px; margin-bottom:14px; font-size:11px; color:var(--ink-3); }
.aff-legend-item { display:inline-flex; align-items:center; gap:5px; }
.aff-legend-dot { width:11px; height:11px; border-radius:3px; flex-shrink:0; }
.aff-grid { display:flex; flex-direction:column; gap:3px; min-width:330px; }
.aff-row { display:grid; grid-template-columns:90px repeat(12,1fr); gap:2px; align-items:center; }
.aff-name { font-size:11px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:4px; }
.aff-cell { font-size:8px; font-weight:600; font-family:var(--mono); text-align:center; padding:5px 0; border-radius:4px; overflow:hidden; white-space:nowrap; background:#fff; border:1px solid #EEF1F5; }
.aff-head { position:sticky; top:0; background:var(--bg); z-index:1; padding-bottom:2px; }
.aff-head .aff-name { color:var(--ink-4); font-size:9px; text-transform:uppercase; letter-spacing:.04em; }
.aff-head-cell { background:transparent; color:var(--ink-4); font-size:9px; font-weight:700; text-align:center; }
@media (max-width:768px){ .aff-row { grid-template-columns:70px repeat(12,1fr); } .aff-name{ font-size:10px; } .aff-cell{ font-size:7px; } }

/* ── FICHE MÉDECIN ── */
.doc-panel-overlay {
  position: fixed; inset: 0; background: rgba(13,17,23,.45);
  z-index: 400; display: none; align-items: flex-end; justify-content: flex-end;
}
.doc-panel-overlay.open { display: flex; }
.doc-panel {
  background: var(--white); width: 480px; height: 100vh;
  box-shadow: -8px 0 32px rgba(0,0,0,.12);
  display: flex; flex-direction: column;
  animation: slideInRight .25s cubic-bezier(.16,1,.3,1);
}
@keyframes slideInRight { from{transform:translateX(40px);opacity:0;} to{transform:translateX(0);opacity:1;} }
.doc-panel-header {
  padding: 20px 20px 16px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px; flex-shrink: 0;
}
.doc-panel-avatar {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; font-family: var(--mono); flex-shrink: 0;
}
.doc-panel-name { font-size: 16px; font-weight: 700; color: var(--ink); }
.doc-panel-meta { font-size: 12px; color: var(--ink-4); margin-top: 2px; }
.doc-panel-close {
  margin-left: auto; width: 32px; height: 32px; border: 1px solid var(--line);
  background: var(--line-light); border-radius: 8px; cursor: pointer;
  font-size: 16px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .15s;
}
.doc-panel-close:hover { background: var(--red); border-color: var(--red); color: white; }
.doc-panel-nav {
  padding: 10px 20px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.doc-nav-btn {
  width: 28px; height: 28px; border: 1px solid var(--line); background: var(--white);
  border-radius: 6px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 12px; transition: all .15s;
}
.doc-nav-btn:hover { border-color: var(--red); color: var(--red); }
.doc-nav-label { font-size: 13px; font-weight: 700; color: var(--ink); flex: 1; text-align: center; }
.doc-panel-body { flex: 1; overflow-y: auto; padding: 16px 20px; }

/* Stats résumé */
.doc-stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.doc-stat-card {
  background: var(--line-light); border-radius: 10px; padding: 10px 8px; text-align: center;
}
.doc-stat-num { font-size: 20px; font-weight: 700; line-height: 1; }
.doc-stat-lbl { font-size: 10px; color: var(--ink-4); margin-top: 3px; }

/* Mini calendrier */
.doc-cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
}
.doc-cal-hdr {
  text-align: center; font-size: 9px; font-weight: 700; color: var(--ink-4);
  padding: 4px 0; text-transform: uppercase;
}
.doc-cal-day {
  border-radius: 6px; padding: 4px 2px; text-align: center;
  font-size: 11px; font-weight: 600; min-height: 42px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 1px solid transparent;
}
.doc-cal-day.empty { background: transparent; }
.doc-cal-day.we { background: var(--line-light); color: var(--ink-4); }
.doc-cal-day.today { border-color: var(--red) !important; }
.doc-cal-day-num { font-size: 11px; font-weight: 700; line-height: 1; }
.doc-cal-tag {
  font-size: 8px; font-weight: 700; padding: 1px 4px; border-radius: 3px;
  font-family: var(--mono); white-space: nowrap; max-width: 36px;
  overflow: hidden; text-overflow: ellipsis;
}
.doc-cal-tag.cs { font-size: 7px; letter-spacing: -0.3px; max-width: 100%; padding: 1px 2px; }
/* Couleurs statuts */
.dc-G    { background: #EFF6FF; color: #1D4ED8; border-color: #BFDBFE; }
.dc-G2   { background: #FFF1F2; color: var(--red); border-color: #FECDD3; }
.dc-18   { background: #F0FDF4; color: #166534; border-color: #BBF7D0; }
.dc-RG   { background: #F5F3FF; color: #6D28D9; border-color: #DDD6FE; }
.dc-A,.dc-CP,.dc-F { background: var(--line-light); color: var(--ink-3); }
.dc-R    { background: #F0FDF4; color: #166534; }
.dc-work { background: var(--white); color: var(--ink-2); border-color: var(--line); }

/* Annuel */
.doc-annual { margin-top: 16px; }
.doc-annual-title { font-size: 11px; font-weight: 700; color: var(--ink-4); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.doc-annual-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.doc-annual-month {
  background: var(--line-light); border-radius: 8px; padding: 8px 10px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px;
}
.doc-annual-month-name { font-weight: 600; color: var(--ink-2); }
.doc-annual-month-stats { display: flex; gap: 6px; }
.doc-annual-stat { font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }


/* ── MOBILE VUE JOUR (< 768px) ── */
@media (max-width: 768px) {

<script>
'use strict';

// ── DONNÉES ────────────────────────────────────────────────────────────
const DOCTORS = [

  { id: 'ZAMARON',   name: 'DR ZAMARON',   initials: 'FZ'  },
  { id: 'TRAN',      name: 'DR TRAN',      initials: 'DT'  },
  { id: 'PRUNET',    name: 'PR PRUNET',    initials: 'BP'  },
  { id: 'ARMAND',    name: 'DR ARMAND',    initials: 'CA', from: '2026-11-01' },
];

const SECTORS_DEF = [
  { code:'VIS', label:'Bloc viscéral',              icon:'Activity'    },
  { code:'REA', label:'Réanimation',                icon:'HeartPulse'  },
  { code:'ORT', label:'Orthopédie',                 icon:'Bone'        },
  { code:'DVI', label:'Pose DVI',                   icon:'Syringe'     },
  { code:'ORL', label:'ORL / Ophtalmologie',        icon:'Eye'         },
  { code:'END', label:'Endoscopies',                icon:'Microscope'  },
  { code:'CI',  label:'Cardio interventionnelle',   icon:'Heart'       },
  { code:'RI',  label:'Radio interventionnelle',    icon:'Scan'        },
  { code:'MAT', label:'Maternité',                  icon:'Baby'        },
  { code:'CS',  label:'Consultation',               icon:'Stethoscope' },
];

const ABSENT_STATUSES = new Set(['RG','CP','A','F','R']);

const API_URL = 'https://script.google.com/macros/s/AKfycbwSiK_GlpSgw3YNQiecG9-24U2vnzFfCmFXV-6yLbPbjRL1DtGhpfvRsxMjemho0Is/exec';

// ── STATE ──────────────────────────────────────────────────────────────
let DATA = null;
let currentMonthId = null;
let currentWeekIdx = 0;
let currentMainView = 'planning';
let currentYear = null;
let activeYear = null; // année active depuis l'API (sélectionnée par défaut)

// ── UTILS ──────────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function isWeekend(wd){ return wd==='S'||wd==='D'; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function isoWeek(dateStr){
  const dt=new Date(dateStr);
  const tmp=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
  tmp.setUTCDate(tmp.getUTCDate()+4-(tmp.getUTCDay()||7));
  const ys=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));
  return Math.ceil((((tmp-ys)/86400000)+1)/7);
}

function getWeeksInMonth(month){
  const weekNums=[...new Set(month.days.map(d=>isoWeek(d.date)))];
  const weeks=[];
  weekNums.forEach(wn=>{
    const refDay=month.days.find(d=>isoWeek(d.date)===wn);
    if(!refDay) return;
    const refDate=new Date(refDay.date);
    const dow=refDate.getDay()||7;
    const monday=new Date(refDate);
    monday.setDate(refDate.getDate()-(dow-1));
    let daysInThisMonth=0, daysInOtherMonths=0;
    for(let i=0;i<7;i++){
      const d=new Date(monday); d.setDate(monday.getDate()+i);
      if(d.getMonth()+1===month.month&&d.getFullYear()===month.year) daysInThisMonth++;
      else daysInOtherMonths++;
    }
    // Exception : dernier mois du planning (janvier N+1, < 7 jours) — on affiche quand même
    const isLastMonth = DATA && month === DATA.months[DATA.months.length - 1];
    if(!isLastMonth && daysInThisMonth<=daysInOtherMonths) return;
    const days=[];
    for(let i=0;i<7;i++){
      const d=new Date(monday); d.setDate(monday.getDate()+i);
      const dateStr=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const found=month.days.find(md=>md.date===dateStr);
      if(found){
        days.push({...found, dayIdx:month.days.indexOf(found), sourceMonth:null});
      } else {
        const wd=['D','L','M','M','J','V','S'][d.getDay()];
        const otherMonth=DATA.months.find(m=>m.days.some(md=>md.date===dateStr));
        if(otherMonth){
          const otherDay=otherMonth.days.find(md=>md.date===dateStr);
          days.push({...otherDay, dayIdx:otherMonth.days.indexOf(otherDay), sourceMonth:otherMonth});
        } else {
          days.push({day:d.getDate(), weekday:wd, date:dateStr, dayIdx:-1, sourceMonth:null});
        }
      }
    }
    weeks.push({weekNum:wn, days});
  });
  // Filtrer les semaines non validées (sauf semaine courante)
  const todayIso = isoWeek(todayStr());
  const validatedWeeks = new Set((month.weeks||[]).filter(w=>w.validated).map(w=>w.isoWeek));
  const filtered = weeks.filter(w => w.weekNum === todayIso || validatedWeeks.has(w.weekNum));
  return filtered.sort((a,b)=>a.weekNum-b.weekNum);
}

function weekDaysFull(weekInfo){
  const out=Array(7).fill(null);
  weekInfo.days.forEach(d=>{
    const dt=new Date(d.date);
    let dow=dt.getDay(); if(dow===0)dow=6; else dow-=1;
    out[dow]=d;
  });
  return out;
}

// ── INIT ───────────────────────────────────────────────────────────────
async function init(){
  // 1. Récupérer l'année active depuis l'API
  activeYear = new Date().getFullYear();
  try {
    const params = new URLSearchParams({payload: JSON.stringify({action:'getActiveYear'})});
    const yearRes = await fetch(API_URL + '?' + params.toString());
    const yearData = await yearRes.json();
    if(yearData.success && yearData.year) activeYear = yearData.year;
  } catch(e){}

  // 2. Détecter toutes les années disponibles sur GitHub (2026 → année courante + 1)
  //    On tente un HEAD sur chaque planning_XXXX.json — si le fichier existe → on l'affiche
  const thisYear = new Date().getFullYear();
  const yearsToCheck = [];
  for(let y = 2026; y <= thisYear + 1; y++) yearsToCheck.push(y);

  const availableYears = [];
  await Promise.all(yearsToCheck.map(async y => {
    try {
      const res = await fetch(`./planning_${y}.json`, { method: 'HEAD' });
      if(res.ok) availableYears.push(y);
    } catch(e){}
  }));
  availableYears.sort((a, b) => a - b);

  if(!availableYears.length) {
    document.body.innerHTML = `<div style="padding:40px;font-family:sans-serif;color:#CE1126"><h2>Aucun fichier planning trouvé</h2></div>`;
    return;
  }

  // 3. Sélectionner l'année par défaut : active si disponible, sinon la plus récente
  currentYear = availableYears.includes(activeYear) ? activeYear : availableYears[availableYears.length - 1];

  // 4. Construire le sélecteur d'année
  buildYearSelect(availableYears);

  // 5. Charger le planning de l'année sélectionnée
  await loadYear(currentYear);

  document.getElementById('btnPlanning').onclick = () => setMainView('planning');
  document.getElementById('btnMedecins').onclick = () => setMainView('medecins');
  document.getElementById('btnEquite').onclick = () => setMainView('equite');
  document.getElementById('btnAffect').onclick = () => setMainView('affect');
  document.getElementById('btnAnnee').onclick = () => setMainView('annee');
}

// ── SÉLECTEUR D'ANNÉE ──────────────────────────────────────────────────
function buildYearSelect(availableYears) {
  const sel = document.getElementById('yearSelect');
  sel.innerHTML = '';
  availableYears.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    if(y === currentYear) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = async () => {
    currentYear = parseInt(sel.value);
    await loadYear(currentYear);
    if(currentMainView === 'medecins') renderMedecins();
  };
}

// ── CHARGER UNE ANNÉE ──────────────────────────────────────────────────
let AFFECTATIONS_DATA = {}; // {docId: {1:'VIS', 2:'REA', ...}}

async function loadYear(year) {
  try {
    DATA = await fetch(`./planning_${year}.json?` + Date.now()).then(r => r.json());
  } catch(e) {
    document.body.innerHTML = `<div style="padding:40px;font-family:sans-serif;color:#CE1126"><h2>Erreur de chargement ${year}</h2><pre>${esc(e.message)}</pre></div>`;
    return;
  }

  // Charger les affectations sectorielles (source de vérité pour la vue Médecins)
  try {
    const affRes = await fetch(`./affectations_${year}.json?` + Date.now());
    if (affRes.ok) {
      const affJson = await affRes.json();
      AFFECTATIONS_DATA = affJson.affectations || {};
    }
  } catch(e) { AFFECTATIONS_DATA = {}; }

  // Aller au mois actuel si disponible dans cette année, sinon premier mois
  const now = new Date();
  const found = DATA.months.find(m => m.year === now.getFullYear() && m.month === now.getMonth() + 1);
  currentMonthId = found ? found.id : DATA.months[0].id;
  currentWeekIdx = 0;
  window._weekInitialized = false;

  buildMonthSelect();
  buildWeekNav();
  render();
  // Init mobile après chargement
  checkMobile();
  if (isMobile) { buildMobileDayList(); renderMobileDay(); }
}

function goToToday(){
  // Basculer sur l'année active si on est sur une année archivée
  const now = new Date();
  const todayYear = now.getFullYear();
  if(currentYear !== todayYear) {
    const sel = document.getElementById('yearSelect');
    // Chercher si l'année courante est dans le sélecteur
    const opt = [...sel.options].find(o => parseInt(o.value) === todayYear);
    if(opt) {
      sel.value = todayYear;
      currentYear = todayYear;
      loadYear(todayYear).then(() => {
        _goToTodayInCurrentData();
      });
      return;
    }
  }
  _goToTodayInCurrentData();
}

function _goToTodayInCurrentData(){
  const now = new Date();
  const found = DATA.months.find(m => m.year === now.getFullYear() && m.month === now.getMonth() + 1);
  if(!found) return;
  currentMonthId = found.id;
  currentWeekIdx = 0;
  window._weekInitialized = false;
  buildMonthSelect();
  buildWeekNav();
  render();
}

// ── VIEW TOGGLE ────────────────────────────────────────────────────────
function renderAnnee(){
  const wrap=document.getElementById('annWrap');
  if(!DATA||!DATA.months){ wrap.innerHTML=''; return; }
  const META={'':{bg:'#fff',fg:'#94A3B8'},'V':{bg:'#EEF4FB',fg:'#1D6FB8'},'F':{bg:'#FDF3E3',fg:'#B45309'},
    'TP':{bg:'#FEF3C7',fg:'#92400E'},'CL':{bg:'#F3E8FF',fg:'#7C3AED'},'A':{bg:'#F8FAFC',fg:'#94A3B8'},
    'G':{bg:'#1E293B',fg:'#fff'},'G2':{bg:'#334155',fg:'#fff'},'RG':{bg:'#FFF7ED',fg:'#C2410C'},
    '18':{bg:'#F0FDF4',fg:'#166534'},'R':{bg:'#DCFCE7',fg:'#166534'}};
  const meta=c=>META[c]||{bg:'#fff',fg:'#334155'};
  const _now=new Date();
  const todayStr=_now.getFullYear()+'-'+String(_now.getMonth()+1).padStart(2,'0')+'-'+String(_now.getDate()).padStart(2,'0');
  const MOIS=['','Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
  const allDays=[]; DATA.months.forEach(m=>m.days.forEach((d,i)=>allDays.push({d,m,i})));
  const order=[], init={};
  DATA.months.forEach(m=>m.doctors.forEach(dc=>{ if(!(dc.id in init)){ init[dc.id]=dc.initials||dc.id; order.push(dc.id); } }));
  const baseYear=DATA.months[0].year;
  let band='<tr><th class="ann-name ann-corner"></th>', drow='<tr><th class="ann-name">MAR</th>';
  let i=0;
  while(i<allDays.length){
    const refY=allDays[i].m.year, refM=allDays[i].m.month; let span=0;
    while(i+span<allDays.length && allDays[i+span].m.year===refY && allDays[i+span].m.month===refM) span++;
    band+=`<th class="ann-month" colspan="${span}">${MOIS[refM]}${refY!==baseYear?' '+refY:''}</th>`; i+=span;
  }
  band+='</tr>';
  allDays.forEach(x=>{ const we=x.d.isWeekend||x.d.isFerie; const td=x.d.date===todayStr?' today':''; drow+=`<th class="ann-day${we?' we':''}${td}">${x.d.day}</th>`; });
  drow+='</tr>';
  const body=order.map(id=>{
    let row=`<tr><td class="ann-name">${init[id]}</td>`;
    allDays.forEach(x=>{
      const we=x.d.isWeekend||x.d.isFerie;
      const td=x.d.date===todayStr?' today':'';
      const dm=x.m.doctors.find(dc=>dc.id===id);
      if(!dm){ row+=`<td class="ann-cell inactive${we?' we':''}${td}"></td>`; return; }
      let st=(dm.days[x.i]&&dm.days[x.i].status)||''; if(st==='I') st='';
      const mt=meta(st);
      row+=`<td class="ann-cell${we?' we':''}${td}" title="${init[id]} · ${x.d.date} · ${st||'présent'}" style="background:${st?mt.bg:(we?'#F8FAFC':'#fff')};color:${mt.fg}">${st}</td>`;
    });
    return row+'</tr>';
  }).join('');
  wrap.innerHTML=`<div class="ann-tablewrap"><table class="ann-table"><thead>${band}${drow}</thead><tbody>${body}</tbody></table></div>`;
  // Centrer la colonne du jour à l'ouverture (si l'année affichée contient aujourd'hui)
  requestAnimationFrame(()=>{
    const tw=wrap.querySelector('.ann-tablewrap'), thc=wrap.querySelector('.ann-day.today');
    if(!tw||!thc) return;
    const twR=tw.getBoundingClientRect(), thR=thc.getBoundingClientRect();
    tw.scrollLeft += (thR.left - twR.left) - tw.clientWidth/2 + thR.width/2;
  });
}

// ── MONTH SELECT ───────────────────────────────────────────────────────
function buildMonthSelect(){
  const sel=document.getElementById('monthSelect');
  sel.innerHTML='';
  DATA.months.forEach((m, idx)=>{
    // Masquer le dernier mois s'il a moins de 7 jours (janvier N+1 — déjà visible dans déc.)
    const isLast = idx === DATA.months.length - 1;
    if(isLast && m.days.length < 7) return;
    const opt=document.createElement('option');
    opt.value=m.id; opt.textContent=m.label;
    if(m.id===currentMonthId) opt.selected=true;
    sel.appendChild(opt);
  });
  sel.onchange=()=>{
    currentMonthId=sel.value;
    currentWeekIdx=0;
    window._weekInitialized=false;
    buildWeekNav();
    render();
    if(currentMainView==='medecins') renderMedecins();
    if(isMobile){buildMobileDayList();renderMobileDay();}
  };
}

// ── WEEK NAV ───────────────────────────────────────────────────────────
function buildWeekNav(){
  const month=DATA.months.find(m=>m.id===currentMonthId);
  const weeks=getWeeksInMonth(month);
  const today=todayStr();
  if(currentWeekIdx===0&&!window._weekInitialized){
    const todayWk=weeks.findIndex(w=>w.days.some(d=>d.date===today));
    if(todayWk>=0) currentWeekIdx=todayWk;
    window._weekInitialized=true;
  }
  const container=document.getElementById('weekPills');
  container.innerHTML='';
  weeks.forEach((w,i)=>{
    const first=new Date(w.days[0].date);
    const last=new Date(w.days[w.days.length-1].date);
    const fmt=dt=>dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
    const btn=document.createElement('button');
    btn.className='week-pill'+(i===currentWeekIdx?' active':'');
    btn.textContent=`S${w.weekNum} · ${fmt(first)}–${fmt(last)}`;
    btn.onclick=()=>{ currentWeekIdx=i; buildWeekNav(); render(); };
    container.appendChild(btn);
  });
}

// ── MAIN RENDER ────────────────────────────────────────────────────────
function render(){
  const month=DATA.months.find(m=>m.id===currentMonthId);
  const weeks=getWeeksInMonth(month);
  const week=weeks[currentWeekIdx];
  if(!week){
    // Aucune semaine validée dans ce mois
    document.getElementById('planningTable').innerHTML=
      '<div style="text-align:center;padding:48px 20px;color:#94A3B8;font-size:14px">'+
      '<div style="font-size:32px;margin-bottom:12px">🔒</div>'+
      '<div style="font-weight:600;color:#64748B;margin-bottom:6px">Planning en cours de validation</div>'+
      '<div>Ce mois sera publié prochainement par le comité.</div>'+
      '</div>';
    document.getElementById('bottomPanel').innerHTML='';
    return;
  }
  const daySlots=weekDaysFull(week);
  renderTable(month,daySlots,week);
  renderBottom(month,daySlots,week);
  requestAnimationFrame(()=>{ if(typeof lucide!=='undefined') lucide.createIcons(); });
}

// ── TABLE ──────────────────────────────────────────────────────────────
const DAYS_FR = ['LUNDI','MARDI','MERCREDI','JEUDI','VENDREDI','SAMEDI','DIMANCHE'];

function renderTable(month,daySlots,week){
  const today=todayStr();
  let thead=`<thead><tr><th class="th-sector">SECTEUR</th>`;
  daySlots.forEach((slot,i)=>{
    if(!slot){ thead+=`<th class="th-day weekend"></th>`; return; }
    const isWe=isWeekend(slot.weekday);
    const isFerie=slot.isFerie||false;
    const isTd=slot.date===today;
    const cls=['th-day',(isWe||isFerie)?'weekend':'',isTd?'today':''].filter(Boolean).join(' ');
    thead+=`<th class="${cls}">
      <div class="day-name">${DAYS_FR[i]}</div>
      <div class="day-date">${slot.day}${isFerie?' <span style="font-size:8px;color:#C2410C;font-weight:700">JF</span>':''}</div>
      <div class="am-pm-labels">
        <div class="am-pm-label">AM</div>
        <div class="am-pm-label pm">PM</div>
      </div>
    </th>`;
  });
  thead+=`</tr></thead>`;

  const smap={};
  SECTORS_DEF.forEach(s=>{ smap[s.code]=Array(7).fill(null).map(()=>({am:[],pm:[]})); });

  month.doctors.forEach(doc=>{
    daySlots.forEach((slot,dow)=>{
      if(!slot) return;
      let entry={};
      if(slot.dayIdx>=0){
        if(slot.sourceMonth){
          const otherDoc=slot.sourceMonth.doctors.find(d=>d.id===doc.id);
          entry=otherDoc?(otherDoc.days[slot.dayIdx]||{}):{};
        } else {
          entry=doc.days[slot.dayIdx]||{};
        }
      }
      if(entry.status && ABSENT_STATUSES.has(entry.status)) return;
      const status=entry.status||'';
      // multi-secteur "VIS+REA" → le MAR apparaît dans chaque secteur
      [['am',entry.morning],['pm',entry.afternoon]].forEach(([half,val])=>{
        (val||'').split('+').forEach(raw=>{
          const part=raw.trim(); if(!part) return;
          const key=part.startsWith('CS-')?'CS':part;
          if(smap[key]) smap[key][dow][half].push({init:doc.initials,status,sector:part});
        });
      });
      if(entry.cs&&smap['CS']) smap['CS'][dow].am.push({init:doc.initials,status,sector:entry.cs});
      if(entry.cs2&&smap[entry.cs2]) smap[entry.cs2][dow].am.push({init:doc.initials,status,sector:entry.cs2});
      if(entry.cs3&&smap[entry.cs3]) smap[entry.cs3][dow].pm.push({init:doc.initials,status,sector:entry.cs3});
    });
  });

  const active=SECTORS_DEF.filter(s=>smap[s.code].some(d=>d.am.length||d.pm.length));
  let tbody='<tbody>';
  active.forEach(s=>{
    tbody+=`<tr class="sector-row"><td class="td-sector">
      <div class="sector-label">
        <i data-lucide="${esc(s.icon)}" class="sector-icon-svg"></i>
        <span class="sector-name-text">${esc(s.label)}</span>
      </div></td>`;
    daySlots.forEach((slot,dow)=>{
      const isWe=slot?isWeekend(slot.weekday):true;
      const isTd=slot?slot.date===today:false;
      const cls=['td-day',isWe?'weekend':'',isTd?'today':''].filter(Boolean).join(' ');
      tbody+=`<td class="${cls}">`;
      if(!slot||(!smap[s.code][dow].am.length&&!smap[s.code][dow].pm.length)){
        tbody+=`<div class="slot-pair"><div class="slot"><span class="slot-dash">—</span></div><div class="slot"><span class="slot-dash">—</span></div></div>`;
      } else if(isWe){
        const names=smap[s.code][dow].am;
        const chips=names.map(p=>{
          const c=(p.status==='G'||p.status==='G2')?'slot-name chip-guard':'slot-name';
          return `<span class="${c}">${p.init||''}</span>`;
        });
        tbody+=`<div class="slot-pair" style="display:flex;align-items:center;justify-content:center;gap:4px;height:100%">${chips.join('')}</div>`;
      } else {
        const amNames=smap[s.code][dow].am;
        const pmNames=smap[s.code][dow].pm;
        const makeChips=arr=>{ const chips=arr.map(p=>{const c=(p.status==='G'||p.status==='G2')?'slot-name chip-guard':p.status==='18'?'slot-name chip-h18':'slot-name';return `<span class="${c}">${p.init||''}</span>`;});if(chips.length%2!==0)chips.push('<span class="slot-name-spacer"></span>');return chips.join('');};
        tbody+=`<div class="slot-pair">
          <div class="slot">${amNames.length?makeChips(amNames):'<span class="slot-dash">—</span>'}</div>
          <div class="slot">${pmNames.length?makeChips(pmNames):'<span class="slot-dash">—</span>'}</div>
        </div>`;
      }
      tbody+=`</td>`;
    });
    tbody+=`</tr>`;
  });
  tbody+='</tbody>';
  document.getElementById('planningTable').innerHTML=thead+tbody;
}

// ── BOTTOM ─────────────────────────────────────────────────────────────
function renderBottom(month,daySlots,week){
  const guards=Array(7).fill(null).map(()=>[]);
  const h18=Array(7).fill('');
  const sorties=Array(7).fill(null).map(()=>[]);
  const absents=Array(7).fill(null).map(()=>[]);
  month.doctors.forEach(doc=>{
    daySlots.forEach((slot,dow)=>{
      if(!slot) return;
      let entry={};
      if(slot.dayIdx>=0){
        if(slot.sourceMonth){
          const otherDoc=slot.sourceMonth.doctors.find(d=>d.id===doc.id);
          entry=otherDoc?(otherDoc.days[slot.dayIdx]||{}):{};
        } else { entry=doc.days[slot.dayIdx]||{}; }
      }
      const st=entry.status||'';
      if(st==='G'||st==='G2') guards[dow].push(doc.initials);
      if(st==='18') h18[dow]=doc.initials;
      if(st==='RG') sorties[dow].push(doc.initials);
      if(['A','CP','F','R','I','E'].includes(st)) absents[dow].push({init:doc.initials,reason:st});
    });
  });

  function buildRow(label,cellsFn){
    let row=`<tr><td class="bt-label">${label}</td>`;
    daySlots.forEach((slot,dow)=>{
      const isWe=slot?isWeekend(slot.weekday):true;
      row+=`<td class="bt-cell${isWe?' weekend':''}">${slot?cellsFn(dow):''}</td>`;
    });
    return row+'</tr>';
  }

  let html=`<div class="bt-card">
    <div class="bt-card-header">Gardes &amp; fonctions</div>
    <div class="bt-scroll"><table class="bt-table"><tbody>`;
  html+=buildRow('Garde 24h',dow=>guards[dow].length?guards[dow].map(i=>`<span class="name-tag guard">${i}</span>`).join(''):'<span class="bt-dash">—</span>');
  html+=buildRow('8h – 18h',dow=>h18[dow]?`<span class="name-tag h18">${h18[dow]}</span>`:'<span class="bt-dash">—</span>');
  html+=buildRow('Sortie de garde',dow=>sorties[dow].length?sorties[dow].map(i=>`<span class="name-tag rg">${i}</span>`).join(''):'<span class="bt-dash">—</span>');
  html+=buildRow('Absences / CP / F',dow=>{
    if(!absents[dow].length) return '<span class="bt-dash">—</span>';
    return absents[dow].map(a=>`<span class="name-tag absent" title="${a.reason}">${a.init}</span>`).join('');
  });
  html+=`</tbody></table></div></div>`;
  document.getElementById('bottomSection').innerHTML=html;
}

// Palette couleurs avatars
const AVATAR_COLORS = [
  {bg:'#EFF6FF',fg:'#1D4ED8'},{bg:'#F0FDF4',fg:'#166534'},
  {bg:'#FDF4FF',fg:'#7E22CE'},{bg:'#FFF7ED',fg:'#C2410C'},
  {bg:'#FFF1F2',fg:'#BE123C'},{bg:'#ECFDF5',fg:'#065F46'},
  {bg:'#FFFBEB',fg:'#92400E'},{bg:'#EEF2FF',fg:'#3730A3'},
];
const SECTOR_COLORS = {
  VIS:{bg:'#EFF6FF',fg:'#1D4ED8'},REA:{bg:'#FFF1F2',fg:'#BE123C'},
  ORT:{bg:'#FFF7ED',fg:'#C2410C'},ORL:{bg:'#FDF4FF',fg:'#7E22CE'},
  END:{bg:'#F0FDF4',fg:'#166534'},CI:{bg:'#ECFDF5',fg:'#065F46'},
  RI:{bg:'#FFFBEB',fg:'#92400E'},MAT:{bg:'#FDF2F8',fg:'#9D174D'},
  CS:{bg:'#F0FDF4',fg:'#166534'},VOLANT:{bg:'#F1F5F9',fg:'#64748B'},
};
const MONTH_NAMES_FR=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DAYS_SHORT_FR=['L','M','M','J','V','S','D'];

let currentDocId = null;
let docPanelMonthIdx = 0; // index dans DATA.months

function renderMedecins(){
  const month = DATA.months.find(m=>m.id===currentMonthId);
  const grid = document.getElementById('medGrid');

  // Construire stats par doc pour le mois courant
  const docStats = {};
  month.doctors.forEach((doc,di)=>{
    const counts={G:0,G2:0,'18':0,RG:0,A:0,CP:0,F:0,R:0,presents:0};
    const sectorCounts={};
    month.days.forEach((day,i)=>{
      const entry=doc.days[i]||{};
      const st=entry.status||'';
      if(counts[st]!==undefined) counts[st]++;
      const isWe=isWeekend(day.weekday);
      if(isWe){if(st==='G')counts.presents++;}
      else{if(!['RG','A','CP','F','R'].includes(st))counts.presents++;}
      (entry.morning||'').split('+').forEach(raw=>{const s=raw.trim();if(s&&!s.startsWith('CS-'))sectorCounts[s]=(sectorCounts[s]||0)+1;});
    });
    // Secteur depuis affectations JSON (source de vérité), fallback mode statistique
    const monthNum = month.month;
    const affSector = AFFECTATIONS_DATA[doc.id]?.[monthNum] || AFFECTATIONS_DATA[doc.id]?.[String(monthNum)];
    const sector = affSector || Object.entries(sectorCounts).sort((a,b)=>b[1]-a[1])[0]?.[0] || 'VOLANT';
    const color=AVATAR_COLORS[di%AVATAR_COLORS.length];
    docStats[doc.id]={counts,sector,color,initials:doc.initials,id:doc.id,idx:di};
  });

  // Construire stats annuelles (gardes totales)
  const annualG={};
  DATA.months.forEach(m=>{
    m.doctors.forEach(doc=>{
      if(!annualG[doc.id]) annualG[doc.id]=0;
      m.days.forEach((day,i)=>{
        const st=(doc.days[i]||{}).status||'';
        if(st==='G'||st==='G2') annualG[doc.id]++;
      });
    });
  });

  let html='';
  month.doctors.forEach((doc)=>{
    const s=docStats[doc.id];
    const sc=SECTOR_COLORS[s.sector]||SECTOR_COLORS.VOLANT;
    const absTotal=s.counts.A+s.counts.CP+s.counts.F;
    const name=(doc.id==='PRUNET'?'PR ':'DR ')+doc.id.charAt(0)+doc.id.slice(1).toLowerCase();
    html+=`<div class="med-card" onclick="openDocPanel('${doc.id}')">
      <div class="med-accent" style="background:${sc.fg}"></div>
      <div class="med-card-top">
        <div class="med-avatar" style="background:${sc.bg};color:${sc.fg}">${s.initials}</div>
        <div style="min-width:0">
          <div class="med-name">${esc(name)}</div>
          <div class="med-role">Anesthésiste-réanimateur</div>
        </div>
      </div>
      <span class="med-sector-badge" style="background:${sc.bg};color:${sc.fg}">${s.sector}</span>
      <div class="med-statline">
        <span><b>${s.counts.G+s.counts.G2}</b> garde${(s.counts.G+s.counts.G2)>1?'s':''}</span>
        ${s.counts['18']?`<span><b>${s.counts['18']}</b> 18h</span>`:''}
        ${s.counts.RG?`<span><b>${s.counts.RG}</b> RG</span>`:''}
        ${absTotal?`<span><b>${absTotal}</b> abs.</span>`:''}
      </div>
      <div class="med-foot"><span class="med-foot-yr">${annualG[doc.id]||0}</span> gardes sur l'année</div>
    </div>`;
  });
  grid.innerHTML=html;
}

function docNavMonth(dir){

function renderDocPanel(){
  if(!currentDocId||!DATA) return;
  const month=DATA.months[docPanelMonthIdx];
  const doc=month.doctors.find(d=>d.id===currentDocId);
  if(!doc) return;

  // Header
  const di=month.doctors.findIndex(d=>d.id===currentDocId);
  const color=AVATAR_COLORS[di%AVATAR_COLORS.length];
  const name=(currentDocId==='PRUNET'?'PR ':'DR ')+currentDocId.charAt(0)+currentDocId.slice(1).toLowerCase();
  const av=document.getElementById('dpAvatar');
  av.textContent=doc.initials;
  document.getElementById('dpName').textContent=name;
  document.getElementById('dpNavLabel').textContent=month.label||`${MONTH_NAMES_FR[month.month-1]} ${month.year}`;

  // Secteur principal ce mois — depuis affectations JSON, fallback statistique
  const affSectorPanel = AFFECTATIONS_DATA[currentDocId]?.[month.month] || AFFECTATIONS_DATA[currentDocId]?.[String(month.month)];
  let sector;
  if (affSectorPanel) {
    sector = affSectorPanel;
  } else {
    const sectorCounts={};
    doc.days.forEach(entry=>{
      (entry.morning||'').split('+').forEach(raw=>{const s=raw.trim();if(s&&!s.startsWith('CS-'))sectorCounts[s]=(sectorCounts[s]||0)+1;});
    });
    sector=Object.entries(sectorCounts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'VOLANT';
  }
  const sc=SECTOR_COLORS[sector]||SECTOR_COLORS.VOLANT;
  av.style.background=sc.bg; av.style.color=sc.fg; // avatar raccord au secteur
  document.getElementById('dpMeta').innerHTML=`<span style="background:${sc.bg};color:${sc.fg};padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;font-family:var(--mono)">${sector}</span>`;

  // Stats mois
  const counts={G:0,G2:0,'18':0,RG:0,A:0,CP:0,F:0,R:0,presents:0};
  month.days.forEach((day,i)=>{
    const entry=doc.days[i]||{};
    const st=entry.status||'';
    if(counts[st]!==undefined) counts[st]++;
    const isWe=isWeekend(day.weekday);
    if(isWe){if(st==='G')counts.presents++;}
    else{if(!['RG','A','CP','F','R'].includes(st))counts.presents++;}
  });
  const absTotal=counts.A+counts.CP+counts.F;

  // Stats annuelles
  let annualG=0,annualPresents=0;
  DATA.months.forEach(m=>{
    const d=m.doctors.find(x=>x.id===currentDocId);
    if(!d) return;
    m.days.forEach((day,i)=>{
      const st=(d.days[i]||{}).status||'';
      if(st==='G'||st==='G2') annualG++;
      const isWe=isWeekend(day.weekday);
      if(isWe){if(st==='G')annualPresents++;}
      else{if(!['RG','A','CP','F','R'].includes(st))annualPresents++;}
    });
  });

  // Calendrier mini
  const today=todayStr();
  const y=month.year, m2=month.month;
  const firstDay=new Date(y,m2-1,1);
  const daysInMonth=new Date(y,m2,0).getDate();
  let startDow=firstDay.getDay(); if(startDow===0)startDow=7;

  let calHtml='';
  DAYS_SHORT_FR.forEach(d=>{ calHtml+=`<div class="doc-cal-hdr">${d}</div>`; });
  for(let i=1;i<startDow;i++) calHtml+=`<div class="doc-cal-day empty"></div>`;

  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${y}-${String(m2).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayData=month.days.find(md=>md.date===dateStr);
    const isWe=dayData?isWeekend(dayData.weekday):[0,6].includes(new Date(dateStr).getDay());
    const isToday=dateStr===today;
    const entry=dayData?doc.days[month.days.indexOf(dayData)]||{}:{};
    const st=entry.status||'';
    const morning=entry.morning||'';
    const afternoon=entry.afternoon||'';

    // Déterminer classe et tags
    let cls='doc-cal-day';
    if(isWe) cls+=' we';
    if(isToday) cls+=' today';
    let stClass='';
    let tags=[];

    if(st==='G'||st==='G2'){ stClass=`dc-${st}`; tags.push(`<div class="doc-cal-tag" style="background:#EFF6FF;color:#1D4ED8">${st}</div>`); }
    else if(st==='18'){ stClass='dc-18'; tags.push(`<div class="doc-cal-tag" style="background:#F0FDF4;color:#166534">18h</div>`); }
    else if(st==='RG'){ stClass='dc-RG'; tags.push(`<div class="doc-cal-tag" style="background:#F5F3FF;color:#6D28D9">RG</div>`); }
    else if(['A','CP','F'].includes(st)){ stClass=`dc-${st}`; tags.push(`<div class="doc-cal-tag" style="background:var(--line-light);color:var(--ink-3)">${st}</div>`); }
    else if(st==='R'){ stClass='dc-R'; tags.push(`<div class="doc-cal-tag" style="background:#F0FDF4;color:#166534">R</div>`); }
    else if(morning&&!isWe){
      stClass='dc-work';
      // multi-secteur "VIS+REA" → un tag coloré par secteur
      morning.split('+').forEach(raw=>{
        const part=raw.trim(); if(!part) return;
        const mIsCs = part.startsWith('CS-');
        const sc2 = mIsCs ? SECTOR_COLORS['CS'] : (SECTOR_COLORS[part]||{bg:'#F1F5F9',fg:'#64748B'});
        tags.push(`<div class="doc-cal-tag${mIsCs?' cs':''}" style="background:${sc2.bg};color:${sc2.fg}">${part}</div>`);
      });
      const pmRaw = afternoon && afternoon !== morning ? afternoon : '';
      if(pmRaw){
        pmRaw.split('+').forEach(raw=>{
          const part=raw.trim(); if(!part) return;
          const pIsCs = part.startsWith('CS-');
          const sc3 = pIsCs ? SECTOR_COLORS['CS'] : (SECTOR_COLORS[part]||{bg:'#F1F5F9',fg:'#64748B'});
          tags.push(`<div class="doc-cal-tag${pIsCs?' cs':''}" style="background:${sc3.bg};color:${sc3.fg}">${part}</div>`);
        });
      }
    }

    calHtml+=`<div class="${cls} ${stClass}">
      <div class="doc-cal-day-num">${d}</div>
      ${tags.join('')}
    </div>`;
  }

  // Bilan annuel par mois
  let annualHtml='';
  DATA.months.forEach((mo,mi)=>{
    const d2=mo.doctors.find(x=>x.id===currentDocId);
    if(!d2) return;
    const mc={G:0,G2:0,'18':0,A:0,CP:0,F:0,RG:0,presents:0};
    mo.days.forEach((day,i)=>{
      const st2=(d2.days[i]||{}).status||'';
      if(mc[st2]!==undefined) mc[st2]++;
      const isWe2=isWeekend(day.weekday);
      if(isWe2){if(st2==='G')mc.presents++;}
      else{if(!['RG','A','CP','F','R'].includes(st2))mc.presents++;}
    });
    const abs2=mc.A+mc.CP+mc.F;
    const isCurrentPanel=mi===docPanelMonthIdx;
    annualHtml+=`<div class="doc-annual-month" style="${isCurrentPanel?'background:#FFF1F2;border:1px solid #FECDD3':''}">
      <span class="doc-annual-month-name">${mo.label||MONTH_NAMES_FR[mo.month-1]}</span>
      <div class="doc-annual-month-stats">
        ${(mc.G+mc.G2)?`<span class="doc-annual-stat" style="background:#EFF6FF;color:#1D4ED8">${mc.G+mc.G2}G</span>`:''}
        ${mc['18']?`<span class="doc-annual-stat" style="background:#F0FDF4;color:#166534">${mc['18']}h</span>`:''}
        ${abs2?`<span class="doc-annual-stat" style="background:var(--line-light);color:var(--ink-3)">${abs2}A</span>`:''}
        ${!(mc.G+mc.G2)&&!mc['18']&&!abs2?`<span style="font-size:10px;color:var(--ink-4)">${mc.presents}j</span>`:''}
      </div>
    </div>`;
  });

  document.getElementById('dpBody').innerHTML=`
    <div class="doc-stats-row">
      <div class="doc-stat-card">
        <div class="doc-stat-num" style="color:#1D4ED8">${(counts.G+counts.G2)||'0'}</div>
        <div class="doc-stat-lbl">Gardes</div>
      </div>
      <div class="doc-stat-card">
        <div class="doc-stat-num" style="color:#166534">${counts['18']||'0'}</div>
        <div class="doc-stat-lbl">18h</div>
      </div>
      <div class="doc-stat-card">
        <div class="doc-stat-num">${absTotal||'0'}</div>
        <div class="doc-stat-lbl">Absences</div>
      </div>
      <div class="doc-stat-card">
        <div class="doc-stat-num" style="color:var(--red)">${annualG}</div>
        <div class="doc-stat-lbl">G/an</div>
      </div>
    </div>
    <div class="doc-cal-grid">${calHtml}</div>
    <div class="doc-annual">
      <div class="doc-annual-title">Récapitulatif annuel</div>
      <div class="doc-annual-grid">${annualHtml}</div>
    </div>
  `;
}


function renderEquite(){
  const wrap = document.getElementById('eqWrap');
  if(!wrap || !DATA) return;
  let agg = {};
  if (DATA.equiteInitiale && DATA.equiteInitiale.length) {
    // Snapshot figé à la génération — pas de dérive avec les échanges/dons
    const initOf = {};
    (DATA.months[0]?.doctors||[]).forEach(d => initOf[d.id] = d.initials);
    DATA.equiteInitiale.forEach(e => {
      agg[e.id] = {id:e.id, init: initOf[e.id]||e.id.slice(0,3), total:e.total, sa:e.sa, di:e.di, ve:e.ve, je:e.je, vd:e.vd, jf:e.jf, vjf:e.vjf};
    });
  } else {
    DATA.months.forEach(m => {
      m.doctors.forEach(d => {
        if(!agg[d.id]) agg[d.id] = {id:d.id, init:d.initials, total:0, sa:0, di:0, ve:0, je:0};
        m.days.forEach((day, i) => {
          const st = (d.days[i]||{}).status || '';
          if(st==='G' || st==='G2'){
            agg[d.id].total++;
            const w = day.dow;
            if(w===6) agg[d.id].sa++;
            else if(w===0) agg[d.id].di++;
            else if(w===5) agg[d.id].ve++;
            else if(w===4) agg[d.id].je++;
          }
        });
      });
    });
  }
  const list = Object.values(agg).filter(a=>a.total>0).sort((a,b)=>b.total-a.total);
  if(!list.length){ wrap.innerHTML = '<div style="padding:30px;text-align:center;color:var(--ink-4)">Aucune garde dans ce planning.</div>'; return; }
  const totals = list.map(a=>a.total);
  const sum = totals.reduce((s,t)=>s+t,0);
  const max = Math.max(...totals), min = Math.min(...totals);
  const mean = sum/list.length;
  const meanPct = max ? (mean/max*100) : 0;
  const nameOf = id => (id==='PRUNET'?'Pr ':'Dr ')+id.charAt(0)+id.slice(1).toLowerCase();

  let html = `<div class="eq-summary">
    <div class="eq-kpi"><div class="eq-kpi-num">${sum}</div><div class="eq-kpi-lbl">Gardes réparties</div></div>
    <div class="eq-kpi"><div class="eq-kpi-num">${list.length}</div><div class="eq-kpi-lbl">MAR de garde</div></div>
    <div class="eq-kpi"><div class="eq-kpi-num">${mean.toFixed(1)}</div><div class="eq-kpi-lbl">Moyenne / MAR</div></div>
    <div class="eq-kpi"><div class="eq-kpi-num">${min}–${max}</div><div class="eq-kpi-lbl">Étendue</div></div>
  </div>
  <div class="eq-mean-legend"><span class="tick"></span> Trait = moyenne (${mean.toFixed(1)}). Barre = total annuel (G réa + G2 maternité). Détail des axes prioritaires sous chaque barre.${(DATA.equiteInitiale&&DATA.equiteInitiale.length)?' <b>Répartition figée à la génération</b> — les échanges/dons ne la modifient pas.':''}</div>`;
  list.forEach(a => {
    const pct = max ? (a.total/max*100) : 0;
    html += `<div class="eq-row">
      <div class="eq-who"><div class="eq-av">${a.init}</div><div class="eq-nm">${nameOf(a.id)}</div></div>
      <div class="eq-bar">
        <div class="eq-track"><div class="eq-fill" style="width:${pct}%"></div><div class="eq-mean" style="left:${meanPct}%"></div></div>
        <div class="eq-axes">VD <b>${a.vd||0}</b> · Sam <b>${a.sa}</b> · Jeu <b>${a.je}</b> · JF <b>${a.jf||0}</b> · VJF <b>${a.vjf||0}</b></div>
      </div>
      <div class="eq-total">${a.total}</div>
    </div>`;
  });
  wrap.innerHTML = html;
}

function renderAffectations(){
  const wrap = document.getElementById('affWrap');
  if(!wrap || !DATA) return;
  const MO = ['J','F','M','A','M','J','J','A','S','O','N','D'];
  const MOF = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const docs = (DATA.months[0]?.doctors || []).slice().sort((a,b)=>a.id.localeCompare(b.id));
  const nameOf = id => (id==='PRUNET'?'Pr ':'Dr ')+id.charAt(0)+id.slice(1).toLowerCase();
  const secOf = (id,m) => { const a = AFFECTATIONS_DATA[id]||{}; return a[m] || a[String(m)] || 'VOLANT'; };
  const abbr = s => s==='VOLANT' ? 'VOL' : s;
  const SECLABELS = {VIS:'Viscéral',REA:'Réanimation',ORT:'Ortho',ORL:'ORL',END:'Endoscopies',CI:'Cardio/Inter',RI:'Radio/Inter',MAT:'Maternité',VOLANT:'Volant'};
  const present = new Set();
  docs.forEach(d => { for(let m=1;m<=12;m++) present.add(secOf(d.id,m)); });
  const legendOrder = ['VIS','REA','ORT','ORL','END','CI','RI','MAT','VOLANT'].filter(s=>present.has(s));

  let html = `<div class="aff-legend">`;
  legendOrder.forEach(s=>{ const sc=SECTOR_COLORS[s]||SECTOR_COLORS.VOLANT; html += `<span class="aff-legend-item"><span class="aff-legend-dot" style="background:${sc.fg}"></span>${SECLABELS[s]||s}</span>`; });
  html += `</div><div class="aff-grid">`;
  html += `<div class="aff-row aff-head"><div class="aff-name">Médecin</div>`;
  MO.forEach((mi,i)=>{ html += `<div class="aff-head-cell" title="${MOF[i]}">${mi}</div>`; });
  html += `</div>`;
  docs.forEach(d=>{
    html += `<div class="aff-row"><div class="aff-name" title="${nameOf(d.id)}">${nameOf(d.id)}</div>`;
    for(let m=1;m<=12;m++){
      const sec = secOf(d.id,m);
      const sc = SECTOR_COLORS[sec] || SECTOR_COLORS.VOLANT || {bg:'#F1F5F9',fg:'#64748B'};
      html += `<div class="aff-cell" style="color:${sc.fg};box-shadow:inset 0 -2px 0 ${sc.fg}" title="${MOF[m-1]} : ${sec}">${abbr(sec)}</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  wrap.innerHTML = html;
}

init();

// ── MOBILE ────────────────────────────────────────────────────────────
let isMobile = window.innerWidth <= 768;
let currentDayIdx = 0;
let mobilePlanningView = 'planning';
let allDaysFlat = [];

const DAYS_FR_FULL = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MONTHS_FR_FULL = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

function checkMobile() {
  isMobile = window.innerWidth <= 768;
  document.getElementById('mobileView').style.display = isMobile ? 'flex' : 'none';
  document.getElementById('mobileBottomNav').style.display = isMobile ? 'flex' : 'none';
}
window.addEventListener('resize', checkMobile);

function mobileSetView(v) {
  mobilePlanningView = v;
  document.getElementById('mbtnPlanning').classList.toggle('active', v==='planning');
  document.getElementById('mbtnMedecins').classList.toggle('active', v==='medecins');
  const mbe = document.getElementById('mbtnEquite'); if(mbe) mbe.classList.toggle('active', v==='equite');
  const mba = document.getElementById('mbtnAffect'); if(mba) mba.classList.toggle('active', v==='affect');
  const content = document.getElementById('mobileDayContent');
  const medView = document.getElementById('medecinsView');
  const eqView = document.getElementById('equiteView');
  const afView = document.getElementById('affectView');
  const dayNav = document.getElementById('mobileDayNav');
  if(dayNav) dayNav.style.display = v==='planning' ? '' : 'none';
  content.style.display = v==='planning' ? '' : 'none';
  medView.style.display = v==='medecins' ? 'block' : 'none';
  if(eqView) eqView.style.display = v==='equite' ? 'block' : 'none';
  if(afView) afView.style.display = v==='affect' ? 'block' : 'none';
  if (v === 'planning') renderMobileDay();
  else if (v === 'medecins') renderMedecins();
  else if (v === 'equite') renderEquite();
  else if (v === 'affect') renderAffectations();
}

function buildMobileDayList() {
  if (!DATA) return;
  const month = DATA.months.find(m => m.id === currentMonthId);
  if (!month) return;
  allDaysFlat = month.days.map((day, idx) => ({...day, dayIdx: idx, month}));
  const today = todayStr();
  const todayIdx = allDaysFlat.findIndex(d => d.date === today);
  currentDayIdx = todayIdx >= 0 ? todayIdx : 0;
}

function mobilePrevDay() {
  if (currentDayIdx > 0) { currentDayIdx--; renderMobileDay(); return; }
  const sel = document.getElementById('monthSelect');
  if (sel.selectedIndex > 0) {
    sel.selectedIndex--;
    currentMonthId = sel.value;
    window._weekInitialized = false;
    buildWeekNav();
    buildMobileDayList();
    currentDayIdx = allDaysFlat.length - 1;
    renderMobileDay();
    if (!isMobile) render();
  }
}

function mobileNextDay() {
  if (currentDayIdx < allDaysFlat.length - 1) { currentDayIdx++; renderMobileDay(); return; }
  const sel = document.getElementById('monthSelect');
  if (sel.selectedIndex < sel.options.length - 1) {
    sel.selectedIndex++;
    currentMonthId = sel.value;
    window._weekInitialized = false;
    buildWeekNav();
    buildMobileDayList();
    currentDayIdx = 0;
    renderMobileDay();
    if (!isMobile) render();
  }
}

let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (!isMobile || mobilePlanningView !== 'planning') return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) { if (dx < 0) mobileNextDay(); else mobilePrevDay(); }
}, {passive:true});

function renderMobileDay() {
  if (!DATA || !allDaysFlat.length) return;
  const dayData = allDaysFlat[currentDayIdx];
  if (!dayData) return;
  const month = dayData.month;
  const today = todayStr();
  const dt = new Date(dayData.date);
  const isToday = dayData.date === today;

  document.getElementById('mobileDayName').textContent = DAYS_FR_FULL[dt.getDay()];
  const dateEl = document.getElementById('mobileDayDate');
  dateEl.textContent = dayData.day + ' ' + MONTHS_FR_FULL[dt.getMonth()];
  dateEl.className = 'mobile-day-date' + (isToday ? ' today' : '');
  document.getElementById('mobileDayJF').textContent = dayData.isFerie ? 'Jour férié' : '';

  const dayIdx = dayData.dayIdx;
  const smap = {};
  SECTORS_DEF.forEach(s => { smap[s.code] = {am:[], pm:[]}; });
  const guards = [], h18arr = [], rg = [], absents = [];

  month.doctors.forEach(doc => {
    const entry = doc.days[dayIdx] || {};
    const st = entry.status || '';
    if (st==='G'||st==='G2') guards.push(doc.initials);
    if (st==='18') h18arr.push(doc.initials);
    if (st==='RG') rg.push(doc.initials);
    if (['A','CP','F','R'].includes(st)) absents.push(doc.initials);
    if (ABSENT_STATUSES.has(st)) return;
    // multi-secteur "VIS+REA" → le MAR apparaît dans chaque secteur
    [['am',entry.morning],['pm',entry.afternoon]].forEach(([half,val])=>{
      (val||'').split('+').forEach(raw=>{
        const part=raw.trim(); if(!part) return;
        const key=part.startsWith('CS-')?'CS':part;
        if(smap[key]) smap[key][half].push(doc.initials);
      });
    });
    if (entry.cs && smap['CS']) smap['CS'].am.push(doc.initials);
  });

  const chip = (init, cls='') => `<span class="mobile-chip ${cls}">${init}</span>`;
  const dash = () => '<span class="mobile-chip dash">—</span>';
  let html = '';

  const isWE = dayData.isWeekend || dayData.isFerie;
  if (!isWE) {
    const activeSectors = SECTORS_DEF.filter(s => smap[s.code].am.length || smap[s.code].pm.length);
    activeSectors.forEach(s => {
      const am = smap[s.code].am;
      const pm = smap[s.code].pm;
      html += `<div class="mobile-sector-card">
        <div class="mobile-sector-header"><span class="mobile-sector-name">${s.label}</span></div>
        <div class="mobile-sector-body">
          <div class="mobile-slot">
            <div class="mobile-slot-label">Matin</div>
            <div class="mobile-slot-names">${am.length ? am.map(i=>chip(i)).join('') : dash()}</div>
          </div>
          <div class="mobile-slot">
            <div class="mobile-slot-label">Après-midi</div>
            <div class="mobile-slot-names">${pm.length ? pm.map(i=>chip(i)).join('') : dash()}</div>
          </div>
        </div>
      </div>`;
    });
  }

  html += `<div class="mobile-gardes-section"><div class="mobile-gardes-title">Gardes &amp; fonctions</div>`;
  if (guards.length) html += `<div class="mobile-garde-row"><div class="mobile-garde-label">Garde 24h</div><div class="mobile-garde-names">${guards.map(i=>chip(i,'guard')).join('')}</div></div>`;
  if (h18arr.length) html += `<div class="mobile-garde-row"><div class="mobile-garde-label">8h – 18h</div><div class="mobile-garde-names">${h18arr.map(i=>chip(i,'h18')).join('')}</div></div>`;
  if (rg.length) html += `<div class="mobile-garde-row"><div class="mobile-garde-label">Sortie de garde</div><div class="mobile-garde-names">${rg.map(i=>`<span class="mobile-garde-name rg">${i}</span>`).join('')}</div></div>`;
  if (absents.length) html += `<div class="mobile-garde-row"><div class="mobile-garde-label">Absents</div><div class="mobile-garde-names">${absents.map(i=>`<span class="mobile-garde-name absent">${i}</span>`).join('')}</div></div>`;
  if (!guards.length && !h18arr.length && !rg.length && !absents.length) html += `<div class="mobile-garde-row"><div style="color:var(--ink-4);font-size:12px;padding:4px 0">—</div></div>`;
  html += `</div>`;

  document.getElementById('mobileDayContent').innerHTML = html;
}

// Hooks
const _origRender = render;
render = function() { _origRender(); if(isMobile){buildMobileDayList();renderMobileDay();} };

</script>
