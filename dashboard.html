<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portail · CHPG Monaco</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#CE1126">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Portail CHPG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root {
  --red: #CE1126;
  --red-soft: #F8E8EB;
  --amber: #D97706;
  --amber-soft: #FEF3C7;
  --ink: #0F172A;
  --ink-2: #334155;
  --ink-3: #64748B;
  --ink-4: #94A3B8;
  --line: #E2E8F0;
  --line-light: #F1F5F9;
  --bg: #F8FAFC;
  --white: #FFFFFF;
  --radius: 12px;
  --mono: 'DM Mono', monospace;
  --surface-2:#EEF1F5; --deep:#1E293B;
  --ok:#166534; --ok-soft:#F0FDF4; --info:#1D4ED8; --info-soft:#EFF6FF;
  --viol:#6D28D9; --viol-soft:#F5F3FF; --rose:#BE123C;
  --me:#1D6FB8; --me-soft:#E8F4FD; --me-border:#B9DCF5;
}

/* ── MODE SOMBRE ── (partagé avec index.html : clé localStorage chpgTheme) */
html[data-theme="dark"] {
  --bg:#0B1220; --white:#151D2E; --line:#28344B; --line-light:#1B2436;
  --ink:#E7ECF6; --ink-2:#C4CEDF; --ink-3:#8D9AB1; --ink-4:#697891;
  --red:#F4586B; --red-soft:#3A1620; --amber:#F0A64A; --amber-soft:#38290F;
  --surface-2:#1B2436; --deep:#232F45;
  --ok:#5BD08B; --ok-soft:#122A1D; --info:#7BAAF7; --info-soft:#152341;
  --viol:#B593F2; --viol-soft:#251B3C; --rose:#F27D96;
  --me:#93C3E8; --me-soft:#17293A; --me-border:#2B4763;
  color-scheme:dark;
}
html[data-theme="dark"] body{background:var(--bg)}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER (repris d'index.html) ── */
.header {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between;
  height: 60px; position: sticky; top: 0; z-index: 300;
}
.header-brand { display: flex; align-items: center; gap: 14px; }
.header-flag {
  display: flex; flex-direction: column; width: 28px; height: 28px; border-radius: 6px;
  overflow: hidden; flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.flag-top { flex: 1; background: var(--red); }
.flag-bottom { flex: 1; background: var(--white); border-top: 1px solid var(--line); }
.header-title { font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
.header-sub { font-size: 11px; color: var(--ink-4); margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 8px; }

.theme-btn{width:34px;height:34px;border:1px solid var(--line);background:var(--white);border-radius:10px;cursor:pointer;font-size:15px;line-height:1;transition:background .15s ease}
.theme-btn:hover{background:var(--line-light)}
.me-pill{display:inline-flex;align-items:center;gap:6px;background:var(--me-soft);color:var(--me);border:1px solid var(--me-border);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.me-pill:hover{filter:brightness(.97)}
.me-pill-logout{opacity:.55;font-weight:700;margin-left:1px}
.me-pill:hover .me-pill-logout{opacity:1;color:var(--red)}

/* ── PAGE ── */
.wrap { max-width: 960px; margin: 0 auto; padding: 40px 24px 64px; }
.hello { margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); }
.hello-sub { margin: 0 0 32px; font-size: 14px; color: var(--ink-3); }

.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.tile {
  position: relative;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px 20px;
  text-decoration: none;
  color: inherit;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
a.tile, .tile.clickable { cursor: pointer; }
a.tile:hover, .tile.clickable:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(15,23,42,.10);
  border-color: var(--me-border);
}
.tile-ico {
  width: 46px; height: 46px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  background: var(--me-soft); color: var(--me);
}
.tile-ico svg { width: 24px; height: 24px; }
.tile-title { font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
.tile-sub { font-size: 13px; color: var(--ink-3); line-height: 1.45; }
.tile-arrow { margin-top: auto; font-size: 13px; font-weight: 600; color: var(--me); display: flex; align-items: center; gap: 4px; }

.tile.soon { opacity: .62; cursor: default; }
.tile.soon .tile-ico { background: var(--surface-2); color: var(--ink-4); }
.badge-soon {
  position: absolute; top: 14px; right: 14px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--amber); background: var(--amber-soft);
  border-radius: 999px; padding: 3px 9px;
}

/* ── VUE TOPOS ── */
.topos-head { display:flex; align-items:center; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
.btn-back {
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--line); background:var(--white); color:var(--ink-2);
  border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer;
  font-family:inherit; transition:background .15s ease;
}
.btn-back:hover { background:var(--line-light); }
.topos-head h2 { margin:0; font-size:20px; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
.topos-count { font-size:13px; color:var(--ink-4); font-weight:500; }

.topo-card { background:var(--white); border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden; }
.topo-card.single { display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer; transition:background .12s ease; }
.topo-card.single:hover { background:var(--line-light); }
.topo-card-head { display:flex; align-items:center; gap:14px; padding:16px 18px; }
.topo-ico { width:40px; height:40px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--me-soft); color:var(--me); }
.topo-ico.multi { background:var(--amber-soft); color:var(--amber); }
.topo-ico svg { width:20px; height:20px; }
.topo-body { flex:1; min-width:0; }
.topo-title { font-size:15px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; }
.topo-meta { font-size:12px; color:var(--ink-4); margin-top:2px; }
.topo-open { width:18px; height:18px; color:var(--ink-4); flex-shrink:0; }

.doc-list { border-top:1px solid var(--line); }
.doc-row { display:flex; align-items:center; gap:10px; padding:12px 18px 12px 22px; cursor:pointer; border-top:1px solid var(--line-light); transition:background .12s ease; }
.doc-row:first-child { border-top:none; }
.doc-row:hover { background:var(--line-light); }
.doc-row svg { width:16px; height:16px; color:var(--me); flex-shrink:0; }
.doc-title { flex:1; font-size:14px; color:var(--ink-2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.doc-size { font-size:12px; color:var(--ink-4); flex-shrink:0; }
.doc-row.loading, .topo-card.single.loading { opacity:.5; pointer-events:none; }

.topos-loading, .topos-empty { text-align:center; padding:48px 20px; color:var(--ink-3); font-size:14px; line-height:1.6; }
.topos-empty span { font-size:12.5px; color:var(--ink-4); }

/* ── VUE STAFFS ── */
.staff-card { display:flex; gap:14px; align-items:flex-start; background:var(--white); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:12px; }
.staff-date { flex-shrink:0; width:60px; text-align:center; background:var(--me-soft); border-radius:10px; padding:8px 6px; }
.staff-dow { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--me); }
.staff-dnum { font-size:22px; font-weight:800; line-height:1.05; color:var(--ink); }
.staff-month { font-size:11px; color:var(--me); font-weight:600; }
.staff-body { flex:1; min-width:0; padding-top:2px; }
.staff-theme { font-size:15px; font-weight:700; color:var(--ink); line-height:1.35; }
.staff-meta { font-size:13px; color:var(--ink-3); margin-top:5px; display:flex; flex-wrap:wrap; gap:3px 14px; }
.staff-meta span { display:inline-flex; align-items:center; gap:5px; }
.staff-meta svg { width:14px; height:14px; color:var(--ink-4); flex-shrink:0; }

/* Barre de chargement API (fine, en haut) */
#apiBar{position:fixed;top:0;left:0;height:2px;width:0;background:var(--red);z-index:9998;transition:width .3s ease,opacity .3s ease;opacity:0}
#apiBar.on{width:80%;opacity:1}

@media(max-width:640px){
  .header { padding: 0 14px; height: 52px; }
  .header-sub { display: none; }
  .wrap { padding: 28px 16px 48px; }
  .hello { font-size: 21px; }
  .tiles { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ── CONNEXION (auth nominatif — identique à index.html) ─────────────── -->
<div id="viewAuthOverlay" style="position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(15,23,42,.08);padding:36px 32px;width:100%;max-width:380px;text-align:center">
    <div style="display:inline-flex;flex-direction:column;width:34px;height:24px;border-radius:4px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.2)">
      <div style="flex:1;background:var(--red)"></div><div style="flex:1;background:#fff;border:1px solid var(--line);border-top:none"></div>
    </div>
    <div style="font-size:18px;font-weight:800;color:var(--ink)">Portail CHPG Monaco</div>
    <div style="font-size:13px;color:var(--ink-3);margin:4px 0 22px">Service d'Anesthésie-Réanimation</div>
    <input id="viewAuthInput" type="password" placeholder="Code d'accès personnel" autocomplete="off" autocapitalize="characters"
      style="width:100%;box-sizing:border-box;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;text-align:center;letter-spacing:2px;font-family:monospace"/>
    <button id="viewAuthBtn" onclick="viewLogin()"
      style="width:100%;margin-top:12px;padding:12px;background:var(--red);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer">Accéder →</button>
    <div id="viewAuthErr" style="display:none;margin-top:12px;font-size:13px;color:var(--red);font-weight:600"></div>
    <div style="margin-top:18px;font-size:11.5px;color:var(--ink-4)">Utilisez le même code que pour la saisie de vos indisponibilités.</div>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-brand">
    <div class="header-flag"><div class="flag-top"></div><div class="flag-bottom"></div></div>
    <div>
      <div class="header-title">Portail CHPG Monaco</div>
      <div class="header-sub">Service d'Anesthésie-Réanimation</div>
    </div>
  </div>
  <div class="header-right">
    <button id="themeBtn" class="theme-btn" onclick="cycleTheme()" title="Thème">🌗</button>
    <span id="mePill" class="me-pill" style="display:none"></span>
  </div>
</div>

<!-- CONTENU -->
<div class="wrap" id="portal" style="display:none">
  <div id="tilesView">
    <h1 class="hello" id="hello">Bienvenue</h1>
    <p class="hello-sub">Choisissez une rubrique du service.</p>
    <div class="tiles" id="tiles"></div>
  </div>
  <div id="toposView" style="display:none">
    <div class="topos-head">
      <button class="btn-back" onclick="backToHome()"><i data-lucide="arrow-left" style="width:16px;height:16px"></i> Retour</button>
      <h2>Topos / biblio</h2>
      <span class="topos-count" id="toposCount"></span>
    </div>
    <div id="toposList"></div>
  </div>
  <div id="staffsView" style="display:none">
    <div class="topos-head">
      <button class="btn-back" onclick="backToHome()"><i data-lucide="arrow-left" style="width:16px;height:16px"></i> Retour</button>
      <h2>Staffs à venir</h2>
      <span class="topos-count" id="staffsCount"></span>
    </div>
    <div id="staffsList"></div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwSiK_GlpSgw3YNQiecG9-24U2vnzFfCmFXV-6yLbPbjRL1DtGhpfvRsxMjemho0Is/exec';

let VIEW_CODE = '';
let MY_ID = null;
let MY_ROLE = null;

function esc(s){ return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function _meName(id){ return (id==='PRUNET'?'Pr ':'Dr ')+id.charAt(0)+id.slice(1).toLowerCase(); }

// ── THÈME (clé localStorage partagée avec index.html : chpgTheme) ──
function getThemePref(){ try{return localStorage.getItem('chpgTheme')||'auto';}catch(e){return 'auto';} }
function resolveTheme(pref){ return pref==='auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : pref; }
function applyTheme(){
  const pref=getThemePref(), t=resolveTheme(pref);
  document.documentElement.dataset.theme = t;
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = t==='dark' ? '#0B1220' : '#CE1126';
  const btn=document.getElementById('themeBtn');
  if(btn){ btn.textContent = pref==='auto'?'🌗':(pref==='dark'?'🌙':'☀️');
           btn.title = 'Thème : '+(pref==='auto'?'automatique':(pref==='dark'?'sombre':'clair')); }
}
function cycleTheme(){
  const order=['auto','light','dark'];
  const next=order[(order.indexOf(getThemePref())+1)%3];
  try{localStorage.setItem('chpgTheme',next);}catch(e){}
  applyTheme();
}
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(getThemePref()==='auto') applyTheme(); }); }catch(e){}
applyTheme();

// ── API ──
let _apiBusy = 0;
function _apiBar(on){
  let el = document.getElementById('apiBar');
  if(!el){ el = document.createElement('div'); el.id='apiBar'; document.body.appendChild(el); }
  _apiBusy = Math.max(0, _apiBusy + (on?1:-1));
  el.classList.toggle('on', _apiBusy>0);
}
async function apiPost(payload){
  payload.code = VIEW_CODE;
  _apiBar(true);
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
      redirect:'follow',
    });
    return await res.json();
  } finally { _apiBar(false); }
}

// ── BADGE UTILISATEUR + DÉCONNEXION ──
function applyUserBadge(r){
  MY_ROLE = r.role;
  MY_ID = (r.role==='mar') ? r.id : null;
  const pill = document.getElementById('mePill');
  if(!pill) return;
  const label = MY_ID ? _meName(MY_ID) : 'Admin';
  pill.innerHTML = '👤 ' + esc(label) + ' <span class="me-pill-logout">⏻</span>';
  pill.style.display = 'inline-flex';
  pill.style.cursor = 'pointer';
  pill.title = "Changer d'utilisateur / déconnexion";
  pill.onclick = logout;
  const hello = document.getElementById('hello');
  if(hello) hello.textContent = MY_ID ? ('Bonjour ' + _meName(MY_ID)) : 'Bienvenue';
}
function logout(){
  if(!confirm('Se déconnecter et changer d\'utilisateur ?')) return;
  try{ sessionStorage.removeItem('chpgViewCode'); }catch(e){}
  VIEW_CODE=''; MY_ID=null; MY_ROLE=null;
  location.reload();
}

// ── TUILES ──
const TILES = [
  { key:'planning', title:'Planning', sub:'Gardes, secteurs, consultations et équité.', icon:'calendar-days', href:'index.html', ready:true },
  { key:'topos',    title:'Topos / biblio', sub:'Documents et présentations du service.', icon:'book-open', view:'topos', ready:true },
  { key:'staffs',   title:'Staffs à venir', sub:'Programme des réunions et intervenants.', icon:'presentation', view:'staffs', ready:true },
  { key:'crh',      title:'CRH', sub:'Comptes rendus de réanimation.', icon:'file-text', href:'crh.html', ready:false },
];
function renderTiles(){
  const box = document.getElementById('tiles');
  box.innerHTML = TILES.map(t => {
    const soon = t.ready ? '' : ' soon';
    const tag  = t.ready ? '' : '<span class="badge-soon">Bientôt</span>';
    const arrow = t.ready ? '<div class="tile-arrow">Ouvrir <i data-lucide="arrow-right" style="width:15px;height:15px"></i></div>' : '';
    const inner =
      tag +
      '<div class="tile-ico"><i data-lucide="'+t.icon+'"></i></div>' +
      '<div class="tile-title">'+esc(t.title)+'</div>' +
      '<div class="tile-sub">'+esc(t.sub)+'</div>' +
      arrow;
    if (t.ready && t.href) return '<a class="tile" href="'+t.href+'">'+inner+'</a>';
    if (t.ready && t.view) return '<div class="tile clickable" onclick="openView(\''+t.view+'\')">'+inner+'</div>';
    return '<div class="tile'+soon+'">'+inner+'</div>';
  }).join('');
  if(window.lucide) lucide.createIcons();
}

function showPortal(){
  document.getElementById('viewAuthOverlay').style.display = 'none';
  document.getElementById('portal').style.display = 'block';
  renderTiles();
}

// ── VUE TOPOS ──
function openView(v){ if(v==='topos') openTopos(); else if(v==='staffs') openStaffs(); }
function fmtDate(s){ if(!s) return ''; const p=String(s).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : s; }
function fmtSize(b){ b=Number(b)||0; if(b<1024) return b+' o'; if(b<1048576) return Math.round(b/1024)+' Ko'; return (b/1048576).toFixed(1)+' Mo'; }

async function openTopos(){
  document.getElementById('tilesView').style.display='none';
  document.getElementById('toposView').style.display='block';
  document.getElementById('toposCount').textContent='';
  const box=document.getElementById('toposList');
  box.innerHTML='<div class="topos-loading">Chargement…</div>';
  try{
    const r=await apiPost({action:'listTopos'});
    if(r && r.success){ renderToposList(r); }
    else { box.innerHTML='<div class="topos-empty">'+esc((r&&r.error)||'Erreur de chargement')+'</div>'; }
  }catch(e){ box.innerHTML='<div class="topos-empty">Erreur réseau — réessayez.</div>'; }
}
function backToHome(){
  document.getElementById('toposView').style.display='none';
  document.getElementById('staffsView').style.display='none';
  document.getElementById('tilesView').style.display='block';
}

// ── VUE STAFFS ──
const _JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const _MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function staffDateParts(iso){
  const p=String(iso).split('-'); const d=new Date(+p[0], (+p[1])-1, +p[2]);
  return { dow:_JOURS[d.getDay()], dnum:(+p[2]), month:_MOIS[(+p[1])-1] };
}
async function openStaffs(){
  document.getElementById('tilesView').style.display='none';
  document.getElementById('staffsView').style.display='block';
  document.getElementById('staffsCount').textContent='';
  const box=document.getElementById('staffsList');
  box.innerHTML='<div class="topos-loading">Chargement…</div>';
  try{
    const r=await apiPost({action:'listStaffs'});
    if(r && r.success){ renderStaffsList(r); }
    else { box.innerHTML='<div class="topos-empty">'+esc((r&&r.error)||'Erreur de chargement')+'</div>'; }
  }catch(e){ box.innerHTML='<div class="topos-empty">Erreur réseau — réessayez.</div>'; }
}
function renderStaffsList(data){
  document.getElementById('staffsCount').textContent = data.count ? (data.count + ' à venir') : '';
  const box=document.getElementById('staffsList');
  if(!data.staffs || !data.staffs.length){
    box.innerHTML='<div class="topos-empty">Aucun staff à venir.<br><span>Ajoutez une ligne dans l\'onglet STAFFS du Sheet pour la voir apparaître ici.</span></div>';
    return;
  }
  box.innerHTML = data.staffs.map(function(s){
    const dp=staffDateParts(s.date);
    const meta=[];
    if(s.heure)       meta.push('<span><i data-lucide="clock"></i>'+esc(s.heure)+'</span>');
    if(s.intervenant) meta.push('<span><i data-lucide="user"></i>'+esc(s.intervenant)+'</span>');
    if(s.lieu)        meta.push('<span><i data-lucide="map-pin"></i>'+esc(s.lieu)+'</span>');
    return '<div class="staff-card">'
      + '<div class="staff-date"><div class="staff-dow">'+dp.dow+'</div><div class="staff-dnum">'+dp.dnum+'</div><div class="staff-month">'+dp.month+'</div></div>'
      + '<div class="staff-body"><div class="staff-theme">'+esc(s.theme)+'</div>'
      + (meta.length ? '<div class="staff-meta">'+meta.join('')+'</div>' : '')
      + '</div></div>';
  }).join('');
  if(window.lucide) lucide.createIcons();
}

function renderToposList(data){
  document.getElementById('toposCount').textContent = data.count ? (data.count + (data.count>1?' topos':' topo')) : '';
  const box=document.getElementById('toposList');
  if(!data.topos || !data.topos.length){
    box.innerHTML='<div class="topos-empty">Aucun topo pour l\'instant.<br><span>Déposez un PDF dans le dossier Drive pour le voir apparaître ici.</span></div>';
    return;
  }
  box.innerHTML = data.topos.map(t => {
    if(!t.multi){
      const d=t.docs[0];
      return '<div class="topo-card single" onclick="openDoc(\''+d.id+'\', this)">'
        + '<div class="topo-ico"><i data-lucide="file-text"></i></div>'
        + '<div class="topo-body"><div class="topo-title">'+esc(t.title)+'</div>'
        + '<div class="topo-meta">'+fmtDate(t.date)+' · '+fmtSize(d.size)+'</div></div>'
        + '<i data-lucide="external-link" class="topo-open"></i></div>';
    }
    const rows=t.docs.map(d =>
      '<div class="doc-row" onclick="openDoc(\''+d.id+'\', this)">'
      + '<i data-lucide="file-text"></i><span class="doc-title">'+esc(d.title)+'</span>'
      + '<span class="doc-size">'+fmtSize(d.size)+'</span></div>').join('');
    return '<div class="topo-card"><div class="topo-card-head">'
      + '<div class="topo-ico multi"><i data-lucide="folder"></i></div>'
      + '<div class="topo-body"><div class="topo-title">'+esc(t.title)+'</div>'
      + '<div class="topo-meta">'+t.docs.length+' documents · '+fmtDate(t.date)+'</div></div></div>'
      + '<div class="doc-list">'+rows+'</div></div>';
  }).join('');
  if(window.lucide) lucide.createIcons();
}

function _b64ToBlob(b64, mime){
  const bin=atob(b64), len=bin.length, bytes=new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes], {type: mime||'application/pdf'});
}
async function openDoc(id, el){
  // Ouvrir l'onglet TOUT DE SUITE (dans le geste utilisateur) → évite le
  // blocage popup ; le contenu y est injecté après réception du flux GAS.
  const w = window.open('', '_blank');
  if(el) el.classList.add('loading');
  try{
    const r = await apiPost({action:'getTopo', id:id});
    if(!(r && r.success)){ if(w) w.close(); alert((r&&r.error)||'Ouverture impossible'); return; }
    const url = URL.createObjectURL(_b64ToBlob(r.dataB64, r.mimeType));
    if(w){ w.location.href = url; }
    else {
      const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener';
      document.body.appendChild(a); a.click(); a.remove();
    }
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 120000);
  }catch(e){ if(w) w.close(); alert('Erreur réseau — réessayez.'); }
  finally{ if(el) el.classList.remove('loading'); }
}

// ── AUTH ──
function _authErr(msg){
  const el = document.getElementById('viewAuthErr');
  el.textContent = msg; el.style.display='block';
  setTimeout(()=> el.style.display='none', 4000);
}
async function viewLogin(){
  const code = document.getElementById('viewAuthInput').value.trim().toUpperCase();
  if(!code) return;
  const btn = document.getElementById('viewAuthBtn');
  btn.disabled = true; btn.textContent = 'Vérification…';
  try{
    VIEW_CODE = code;
    const r = await apiPost({action:'login'});
    if(r && r.success){
      try{ sessionStorage.setItem('chpgViewCode', code); }catch(e){}
      applyUserBadge(r);
      showPortal();
    } else {
      VIEW_CODE='';
      _authErr(r && r.error ? r.error : 'Code incorrect');
    }
  } catch(e){ VIEW_CODE=''; _authErr('Erreur réseau — réessayez'); }
  btn.disabled = false; btn.textContent = 'Accéder →';
}
async function viewAutoLogin(){
  let saved=''; try{ saved = sessionStorage.getItem('chpgViewCode')||''; }catch(e){}
  if(!saved) return; // écran de connexion affiché
  try{
    VIEW_CODE = saved;
    const r = await apiPost({action:'login'});
    if(r && r.success){ applyUserBadge(r); showPortal(); }
    else { VIEW_CODE=''; try{ sessionStorage.removeItem('chpgViewCode'); }catch(e){} }
  } catch(e){ VIEW_CODE=''; }
}
document.getElementById('viewAuthInput').addEventListener('keydown', e => { if(e.key==='Enter') viewLogin(); });

if(window.lucide) lucide.createIcons();
viewAutoLogin();
</script>
