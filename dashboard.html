<style>
/* polices chargees via <link> (perf : @import bloquant supprime) */

:root {
  --red: #CE1126;
  --red-soft: #F8E8EB;
  --amber: #D97706;
  --amber-soft: #FEF3C7;
  --ink: #0F172A;
  --ink-2: #334155;
  --ink-3: #64748B;
  --ink-4: #94A3B8;
  --line: #E2E8F0;
  --line-light: #F1F5F9;
  --bg: #F8FAFC;
  --white: #FFFFFF;
  --radius: 12px;
  --mono: 'DM Mono', monospace;
  --surface-2:#EEF1F5; --deep:#1E293B;
  --ok:#166534; --ok-soft:#F0FDF4; --info:#1D4ED8; --info-soft:#EFF6FF;
  --viol:#6D28D9; --viol-soft:#F5F3FF; --rose:#BE123C;
  --me:#1D6FB8; --me-soft:#E8F4FD; --me-border:#B9DCF5;
}
.ver-badge { display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:11px; font-weight:600; color:var(--ink-4); background:var(--line-light); border:1px solid var(--line); border-radius:20px; padding:3px 10px; letter-spacing:.02em; vertical-align:middle; }
.ver-dot { width:5px; height:5px; border-radius:50%; background:#22C55E; flex:none; }

/* ── MODE SOMBRE ── (partagé avec index.html : clé localStorage chpgTheme) */
html[data-theme="dark"] {
  --bg:#0B1220; --white:#151D2E; --line:#28344B; --line-light:#1B2436;
  --ink:#E7ECF6; --ink-2:#C4CEDF; --ink-3:#8D9AB1; --ink-4:#697891;
  --red:#F4586B; --red-soft:#3A1620; --amber:#F0A64A; --amber-soft:#38290F;
  --surface-2:#1B2436; --deep:#232F45;
  --ok:#5BD08B; --ok-soft:#122A1D; --info:#7BAAF7; --info-soft:#152341;
  --viol:#B593F2; --viol-soft:#251B3C; --rose:#F27D96;
  --me:#93C3E8; --me-soft:#17293A; --me-border:#2B4763;
  color-scheme:dark;
}
html[data-theme="dark"] body{background:var(--bg)}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER (repris d'index.html) ── */
.header {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between;
  height: 60px; position: sticky; top: 0; z-index: 300;
}
.header-brand { display: flex; align-items: center; gap: 14px; }
.header-flag {
  display: flex; flex-direction: column; width: 28px; height: 28px; border-radius: 6px;
  overflow: hidden; flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.flag-top { flex: 1; background: var(--red); }
.flag-bottom { flex: 1; background: var(--white); border-top: 1px solid var(--line); }
.header-title { font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
.header-sub { font-size: 11px; color: var(--ink-4); margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 8px; }

.header-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none;transition:border-color .15s,box-shadow .15s,color .15s}
.header-btn:hover{border-color:var(--red);color:var(--red);box-shadow:0 1px 5px rgba(15,23,42,.08)}
.header-btn .hb-ico{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:800;line-height:1}
.theme-btn{width:34px;height:34px;border:1px solid var(--line);background:var(--white);border-radius:10px;cursor:pointer;font-size:15px;line-height:1;transition:background .15s ease}
.theme-btn:hover{background:var(--line-light)}
.me-pill{display:inline-flex;align-items:center;gap:6px;background:var(--me-soft);color:var(--me);border:1px solid var(--me-border);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.me-pill:hover{filter:brightness(.97)}
.me-pill-logout{opacity:.55;font-weight:700;margin-left:1px}
.me-pill:hover .me-pill-logout{opacity:1;color:var(--red)}

/* ── PAGE ── */
.wrap { max-width: 960px; margin: 0 auto; padding: 40px 24px 64px; }
.hello { margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); }
.hello-sub { margin: 0 0 32px; font-size: 14px; color: var(--ink-3); }

.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.tile {
  position: relative;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px 20px;
  text-decoration: none;
  color: inherit;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
a.tile, .tile.clickable { cursor: pointer; }
a.tile:hover, .tile.clickable:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(15,23,42,.10);
  border-color: var(--me-border);
}
.tile-ico {
  width: 46px; height: 46px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  background: var(--me-soft); color: var(--me);
}
.tile-ico svg { width: 24px; height: 24px; }
.tile-title { font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
.tile-sub { font-size: 13px; color: var(--ink-3); line-height: 1.45; }
.tile-arrow { margin-top: auto; font-size: 13px; font-weight: 600; color: var(--me); display: flex; align-items: center; gap: 4px; }

.tile.soon { opacity: .62; cursor: default; }

/* ── TUILE QUI SE SÉPARE EN DEUX (27/07/2026) ──────────────────────────
   Le libéral, c'est DEUX outils : coter/déclarer un patient, et suivre les 30 %.
   Deux tuiles côte à côte alourdiraient la grille ; une page intermédiaire
   ajouterait un clic pour rien. La tuile s'ouvre donc EN PLACE : la face se
   retire, les deux moitiés s'écartent. Aucun changement de page.
   La hauteur est figée à l'ouverture (voir splitOpen) pour éviter que la grille
   ne saute au moment de l'animation. */
.tile.split { padding: 0; overflow: hidden; cursor: default; }
.tile.split .split-face { padding: 22px 20px; display: flex; flex-direction: column; gap: 12px;
  transition: opacity .18s ease, transform .28s cubic-bezier(.4,0,.2,1); cursor: pointer; }
.tile.split.open .split-face { opacity: 0; transform: scale(.97); pointer-events: none; }
.tile.split .split-halves { position: absolute; inset: 0; display: flex; opacity: 0;
  pointer-events: none; transition: opacity .22s ease .06s; }
.tile.split.open .split-halves { opacity: 1; pointer-events: auto; }
.tile.split .split-half { flex: 1; display: flex; flex-direction: column; justify-content: center;
  gap: 6px; padding: 18px; text-decoration: none; color: inherit;
  transform: translateX(-14px); transition: transform .3s cubic-bezier(.4,0,.2,1), background .15s ease; }
.tile.split .split-half + .split-half { transform: translateX(14px); border-left: 1px solid var(--line); }
.tile.split.open .split-half { transform: translateX(0); }
.tile.split .split-half:hover { background: var(--line-light); }
.tile.split .split-half .sh-t { font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; }
.tile.split .split-half .sh-s { font-size: 11.5px; color: var(--ink-3); line-height: 1.4; }
.tile.split .split-back { position: absolute; top: 8px; right: 10px; font-size: 11px; font-weight: 700;
  color: var(--ink-4); background: none; border: none; cursor: pointer; opacity: 0;
  transition: opacity .2s ease .1s; }
.tile.split.open .split-back { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .tile.split .split-face, .tile.split .split-halves, .tile.split .split-half { transition: none; }
}
.tile.soon .tile-ico { background: var(--surface-2); color: var(--ink-4); }
.badge-soon {
  position: absolute; top: 14px; right: 14px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--amber); background: var(--amber-soft);
  border-radius: 999px; padding: 3px 9px;
}

/* ── BANDEAU « MES GARDES » (accueil) ── */
.mg-hero {
  display:flex; align-items:center; gap:16px;
  background:linear-gradient(135deg,#1E293B,#0F172A);
  border:1px solid #1E293B; border-radius:16px;
  padding:18px 20px; margin:0 0 20px; cursor:pointer;
  color:#fff; text-decoration:none;
  transition:transform .15s ease, box-shadow .15s ease;
}
.mg-hero:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(15,23,42,.18); }
.mg-hero-ico { width:46px; height:46px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.12); color:#fff; }
.mg-hero-ico svg { width:24px; height:24px; }
.mg-hero-body { flex:1; min-width:0; }
.mg-hero-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; opacity:.6; }
.mg-hero-main { font-size:17px; font-weight:700; letter-spacing:-.01em; margin-top:2px; }
.mg-hero-sub { font-size:13px; opacity:.72; margin-top:3px; }
.mg-hero-arrow { flex-shrink:0; opacity:.55; display:flex; }
.mg-hero-arrow svg { width:20px; height:20px; }
.mg-hero.loading .mg-hero-main { opacity:.45; }

/* ── VUE MES GARDES (détail) ── */
.mg-tag { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  border-radius:999px; padding:2px 9px; margin-left:8px; vertical-align:middle; }
.mg-tag.g  { background:var(--me-soft);  color:var(--me); }
.mg-tag.g2 { background:var(--red-soft); color:var(--rose); }
.mg-month { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  color:var(--ink-4); margin:22px 0 10px 4px; }
.mg-month:first-child { margin-top:0; }

/* ── VUE MES CONGÉS ── */
.cg-counts { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
.cg-count { border-radius:999px; padding:6px 13px; font-size:13px; font-weight:600; }
.cg-count .cg-n { font-weight:800; }
.cg-count .cg-u { opacity:.7; }
.cg-list { display:flex; flex-direction:column; gap:8px; }
.cg-item { display:flex; align-items:center; gap:10px; background:var(--white); border:1px solid var(--line); border-radius:12px; padding:11px 14px; }
.cg-tag { font-size:11px; font-weight:700; border-radius:7px; padding:3px 9px; flex-shrink:0; }
.cg-range { flex:1; font-size:14px; color:var(--ink); min-width:0; }
.cg-days { font-size:12px; color:var(--ink-4); font-weight:600; flex-shrink:0; }

/* ── VUE TOPOS ── */
.topos-head { display:flex; align-items:center; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
.btn-back {
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--line); background:var(--white); color:var(--ink-2);
  border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer;
  font-family:inherit; transition:background .15s ease;
}
.btn-back:hover { background:var(--line-light); }
.topos-head h2 { margin:0; font-size:20px; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
.topos-count { font-size:13px; color:var(--ink-4); font-weight:500; }

.topo-card { background:var(--white); border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden; }
.topo-card.single { display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer; transition:background .12s ease; }
.topo-card.single:hover { background:var(--line-light); }
.topo-card-head { display:flex; align-items:center; gap:14px; padding:16px 18px; }
.topo-ico { width:40px; height:40px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--me-soft); color:var(--me); }
.topo-ico.multi { background:var(--amber-soft); color:var(--amber); }
.topo-ico svg { width:20px; height:20px; }
.topo-body { flex:1; min-width:0; }
.topo-title { font-size:15px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; }
.topo-meta { font-size:12px; color:var(--ink-4); margin-top:2px; }
.topo-open { width:18px; height:18px; color:var(--ink-4); flex-shrink:0; }

.doc-list { border-top:1px solid var(--line); }
.doc-row { display:flex; align-items:center; gap:10px; padding:12px 18px 12px 22px; cursor:pointer; border-top:1px solid var(--line-light); transition:background .12s ease; }
.doc-row:first-child { border-top:none; }
.doc-row:hover { background:var(--line-light); }
.doc-row svg { width:16px; height:16px; color:var(--me); flex-shrink:0; }
.doc-title { flex:1; font-size:14px; color:var(--ink-2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.doc-size { font-size:12px; color:var(--ink-4); flex-shrink:0; }
.doc-row.loading, .topo-card.single.loading { opacity:.5; pointer-events:none; }

.topos-loading, .topos-empty { text-align:center; padding:48px 20px; color:var(--ink-3); font-size:14px; line-height:1.6; }
.topos-empty span { font-size:12.5px; color:var(--ink-4); }

/* ── VUE STAFFS ── */
.staff-card { display:flex; gap:14px; align-items:flex-start; background:var(--white); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:12px; }
.staff-date { flex-shrink:0; width:60px; text-align:center; background:var(--me-soft); border-radius:10px; padding:8px 6px; }
.staff-dow { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--me); }
.staff-dnum { font-size:22px; font-weight:800; line-height:1.05; color:var(--ink); }
.staff-month { font-size:11px; color:var(--me); font-weight:600; }
.staff-body { flex:1; min-width:0; padding-top:2px; }
.staff-theme { font-size:15px; font-weight:700; color:var(--ink); line-height:1.35; }
.staff-meta { font-size:13px; color:var(--ink-3); margin-top:5px; display:flex; flex-wrap:wrap; gap:3px 14px; }
.staff-meta span { display:inline-flex; align-items:center; gap:5px; }
.staff-meta svg { width:14px; height:14px; color:var(--ink-4); flex-shrink:0; }

/* ── Teinte violette (tuile Protocoles) ── */
.tile-ico.viol { background:var(--viol-soft); color:var(--viol); }

/* ── VUE PROTOCOLES ── */
.protos-search { margin-bottom:14px; }
.proto-group { margin-bottom:10px; }
.proto-spec { display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
  background:var(--white); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  font-size:13px; font-weight:700; color:var(--viol); letter-spacing:.01em; transition:border-color .15s; }
.proto-spec:hover { border-color:var(--viol); }
.proto-spec .chev { transition:transform .18s; display:inline-flex; color:var(--ink-3); }
.proto-group.open .proto-spec .chev { transform:rotate(90deg); }
.proto-spec .spec-name { flex:1; }
.proto-spec .count { background:var(--viol-soft); color:var(--viol); border-radius:999px; padding:1px 9px; font-size:12px; font-weight:700; }
.proto-docs { display:none; padding:8px 0 4px 6px; }
.proto-group.open .proto-docs { display:block; }
.proto-docs .doc-row { background:var(--white); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; }
.proto-docs .doc-row svg { color:var(--viol); }

/* ── VUE ANNUAIRE ── */
.annu-search { margin-bottom:14px; }
.annu-cat { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-4); margin:22px 0 10px 4px; }
.annu-cat:first-child { margin-top:0; }
.annu-team { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-bottom:4px; }
.team-card { display:flex; align-items:center; gap:11px; background:var(--white); border:1px solid var(--line); border-radius:12px; padding:11px 13px; }
.team-ava { width:38px; height:38px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--me-soft); color:var(--me); font-size:13px; font-weight:800; }
.team-body { min-width:0; }
.team-name { font-size:14px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.team-dect { font-size:12.5px; color:var(--ink-3); }
.team-dect.none { color:var(--ink-4); }
.annu-row { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--white); border:1px solid var(--line); border-radius:12px; padding:12px 15px; margin-bottom:8px; }
.annu-lib { font-size:14px; font-weight:600; color:var(--ink); min-width:0; }
.annu-info { font-size:12px; font-weight:400; color:var(--ink-4); margin-top:2px; }
.annu-num, a.annu-num { font-family:var(--mono); font-size:14px; font-weight:600; color:var(--me); text-decoration:none; white-space:nowrap; flex-shrink:0; }
.annu-num:hover { text-decoration:underline; }

/* ── VEILLE BIBLIO ── */
.veille-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.vfilter{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.vfilter button{border:0;background:transparent;color:var(--ink-3);font:600 13px 'DM Sans',sans-serif;padding:6px 14px;border-radius:8px;cursor:pointer}
.vfilter button.on{background:var(--white);color:var(--me);box-shadow:0 1px 2px rgba(15,23,42,.06)}
.vsel,.vsearch{border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:10px;padding:7px 12px;font:500 13px 'DM Sans',sans-serif}
.vsearch{flex:1;min-width:180px}
.vsel:focus,.vsearch:focus{outline:none;border-color:var(--me-border)}
.veille-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:15px 18px;margin-bottom:11px;border-left:3px solid transparent}
.veille-card.unread{border-left-color:var(--me)}
.vc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.vc-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.vc-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.vc-badge.revue{background:var(--me-soft);color:var(--me)}
.vc-badge.theme{background:var(--viol-soft);color:var(--viol)}
.vc-badge.general{background:var(--amber-soft);color:var(--amber)}
.vc-badge.new{background:var(--red-soft);color:var(--red)}
.vc-badge.pubtype{background:var(--surface-2);color:var(--ink-3)}
.vc-themes{font-size:12px;color:var(--viol);font-weight:600;margin-top:3px}
.vc-score{font-size:12px;font-weight:800;color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:2px 8px}
.vc-date{font-size:12px;color:var(--ink-4);font-weight:600}
.vc-title{display:block;font-size:15px;font-weight:700;color:var(--ink);line-height:1.4;text-decoration:none}
.vc-title:hover{color:var(--me)}
.vc-resume{font-size:13px;color:var(--ink-2);line-height:1.5;margin-top:5px}
.vc-journal{font-size:12.5px;color:var(--me);font-weight:600;margin-top:6px}
.vc-authors{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.vc-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.vc-act{font-size:12px;font-weight:600;color:var(--ink-3);background:var(--surface-2);border:0;border-radius:8px;padding:5px 11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.vc-act:hover{color:var(--ink)}
.vc-act.on{background:var(--me-soft);color:var(--me)}

<script>
// Version du site (source unique — tenue à la main, alignée sur les guides).
const SITE_VERSION = 'v1.10.9'; // SITE_VERSION: v1.10.9
const API_URL = 'https://script.google.com/macros/s/AKfycbwSiK_GlpSgw3YNQiecG9-24U2vnzFfCmFXV-6yLbPbjRL1DtGhpfvRsxMjemho0Is/exec';

let VIEW_CODE = '';
let MY_ID = null;
let MY_ROLE = null;
let MY_LIBERAL = false;      // membre du groupement liberal (colonne LIBERAL de MEDECINS)
let INDISPOS_OUVERTE = false;   // campagne de saisie en cours (renvoyé par login)
let INDISPOS_YEAR = null;       // année concernée par la saisie

function esc(s){ return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function _meName(id){ return (id==='PRUNET'?'Pr ':'Dr ')+id.charAt(0)+id.slice(1).toLowerCase(); }

// ── THÈME (clé localStorage partagée avec index.html : chpgTheme) ──
function getThemePref(){ try{return localStorage.getItem('chpgTheme')||'auto';}catch(e){return 'auto';} }
function resolveTheme(pref){ return pref==='auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : pref; }
function applyTheme(){
  const pref=getThemePref(), t=resolveTheme(pref);
  document.documentElement.dataset.theme = t;
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = t==='dark' ? '#0B1220' : '#CE1126';
  const btn=document.getElementById('themeBtn');
  if(btn){ btn.textContent = pref==='auto'?'🌗':(pref==='dark'?'🌙':'☀️');
           btn.title = 'Thème : '+(pref==='auto'?'automatique':(pref==='dark'?'sombre':'clair')); }
}
function cycleTheme(){
  const order=['auto','light','dark'];
  const next=order[(order.indexOf(getThemePref())+1)%3];
  try{localStorage.setItem('chpgTheme',next);}catch(e){}
  applyTheme();
}
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(getThemePref()==='auto') applyTheme(); }); }catch(e){}
applyTheme();

// ── API ──
let _apiBusy = 0;
function _apiBar(on){
  let el = document.getElementById('apiBar');
  if(!el){ el = document.createElement('div'); el.id='apiBar'; document.body.appendChild(el); }
  _apiBusy = Math.max(0, _apiBusy + (on?1:-1));
  el.classList.toggle('on', _apiBusy>0);
}
async function apiPost(payload) {
  payload.code = VIEW_CODE;
  _apiBar(true);
  const _ctrl = new AbortController();
  const _timer = setTimeout(() => _ctrl.abort(), 120000);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      redirect: 'follow',
      signal: _ctrl.signal,
    });
    return await res.json();
  } catch (e) {
    if (e && e.name === 'AbortError') throw new Error('Délai dépassé (2 min) — serveur trop lent ou injoignable, réessayez');
    throw e;
  } finally { clearTimeout(_timer); _apiBar(false); }
}

// ── BADGE UTILISATEUR + DÉCONNEXION ──
function applyUserBadge(r){
  MY_ROLE = r.role;
  MY_ID = (r.role==='mar') ? r.id : null;
  // État de la campagne de saisie (pilote la tuile « Mes indisponibilités »).
  INDISPOS_OUVERTE = !!r.indisposOuverte;
  // Membre du groupement liberal : pilote la tuile Module liberal.
  MY_LIBERAL = !!r.liberal;
  INDISPOS_YEAR = r.indisposYear || null;
  const pill = document.getElementById('mePill');
  if(!pill) return;
  const label = MY_ID ? _meName(MY_ID) : 'Admin';
  pill.innerHTML = '👤 ' + esc(label) + ' <span class="me-pill-logout" aria-label="Déconnexion" style="display:inline-flex;align-items:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>';
  pill.style.display = 'inline-flex';
  pill.style.cursor = 'pointer';
  pill.title = "Changer d'utilisateur / déconnexion";
  pill.onclick = logout;
  const hello = document.getElementById('hello');
  if(hello) hello.textContent = MY_ID ? ('Bonjour ' + _meName(MY_ID)) : 'Bienvenue';
  { const vb = document.getElementById('verBadge'); if (vb) vb.textContent = SITE_VERSION; }
}
function logout(){
  if(!confirm('Se déconnecter et changer d\'utilisateur ?')) return;
  try{ sessionStorage.removeItem('chpgViewCode'); }catch(e){}
  VIEW_CODE=''; MY_ID=null; MY_ROLE=null; MY_LIBERAL=false;
  location.reload();
}

// ── TUILES ──
const TILES = [
  { key:'planning', title:'Planning', sub:'Gardes, secteurs, consultations et équité.', icon:'calendar-days', href:'index.html', ready:true },
  // Tuile de CAMPAGNE : visible uniquement pendant la saisie des indispos
  // (octobre → clôture). Hors campagne, indispos.html ne sert à rien : la tuile
  // disparaît plutôt que d'encombrer le portail 10 mois par an.
  // Le drapeau vient du serveur (présence de INDISPOS_ACTIVE dans CONFIG).
  { key:'indispos', title:'Mes indisponibilités', sub:'Déclarez vos souhaits et vos congés {AN}.', icon:'clock', href:'indispos.html', ready:true, campagne:true, tint:'viol' },
  // (Lot 5-bis) Consultations a venir + absences du MAR sur les 4 semaines qui
  // suivent chaque consultation. ACCES RESTREINT a FROHLICH tant que le comite ne
  // pose pas les consultations a 4 semaines : ouvert a tous, l'ecran serait presque
  // vide. Retirer `only` pour la mise en service (et monter la version du site).
  { key:'consult', title:'Mes consultations', sub:'Vos consultations à venir et vos absences sur la même période.', icon:'calendar-check', href:'absences.html', ready:true, only:'FROHLICH' },
  { key:'conges', title:'Mes congés', sub:'Vacances, formation, TP, récup et congés à venir.', icon:'calendar-off', view:'conges', ready:true },
  { key:'topos',    title:'Topos / biblio', sub:'Documents et présentations du service.', icon:'book-open', view:'topos', ready:true },
  { key:'protocoles', title:'Protocoles', sub:'Procédures du service, classées par spécialité.', icon:'clipboard-list', view:'protocoles', tint:'viol', ready:true },
  { key:'staffs',   title:'Staffs à venir', sub:'Programme des réunions et intervenants.', icon:'presentation', view:'staffs', ready:true },
  { key:'veille',   title:'Veille biblio', sub:'Nouveaux articles PubMed en anesthésie-réanimation.', icon:'radar', view:'veille', ready:true },
  { key:'annuaire', title:'Annuaire', sub:'Numéros de l\'hôpital et DECT de l\'équipe.', icon:'phone', view:'annuaire', ready:true },
  { key:'cr-anesth', title:'CR d\'anesthésie', sub:'Générateur de comptes-rendus d\'anesthésie.', icon:'file-text', href:'./cr-anesthesie/index.html', ready:true },
  // Tuile RESERVEE aux membres du groupement liberal (colonne LIBERAL = O dans
  // MEDECINS). Ouvre directement l'ESTIMATEUR ; celui-ci porte en tete un lien
  // vers guide-liberal.html (cotation, regle des 30 %, antiseche).
  // Colonne absente ou vide => tuile invisible pour tout le monde.
  // ⚠️ `only` AJOUTE (27/07/2026) : la colonne LIBERAL de MEDECINS passe a O pour les
  // 19 membres du groupement, car c'est elle qui construit le releve LIBERAL_CA_{Y}.
  // Sans `only`, les 18 autres verraient la tuile du jour au lendemain, alors que le
  // module est encore en rodage. Pour OUVRIR : retirer `only` et monter la version.
  // TUILE QUI SE SEPARE EN DEUX : le liberal, c'est coter/declarer d'un cote,
  // suivre les 30 % de l'autre. `split` remplace `href` — voir renderTiles.
  { key:'liberal',  title:'Libéral', sub:'Cotation, devis, déclaration — et suivi des 30 %.', icon:'calculator', ready:true, tint:'viol', liberal:true, only:'FROHLICH',
    split:[
      {t:'Cotation & déclaration', s:'Coter un patient, imprimer le devis, déclarer l\'intervention.', href:'docs/module-liberal/maquette_estimateur_liberal.html'},
      {t:'Suivi des 30 %',         s:'Ma position, celle du groupe, les marges.',                    href:'suivi-liberal.html'},
    ] },
  { key:'crh',      title:'CRH', sub:'Comptes rendus de réanimation.', icon:'file-text', href:'crh.html', ready:true, only:'FROHLICH' },
  // Documentation TECHNIQUE du systeme (architecture, wizards, deploiement,
  // depannage). Sans interet pour l'equipe : tuile reservee a FROHLICH, comme CRH.
  // Seul moyen d'y acceder jusqu'ici : taper l'adresse a la main.
  { key:'technique', title:'Guide technique', sub:'Architecture, déploiement, dépannage du système.', icon:'wrench', href:'docs/guide-technique.html', ready:true, only:'FROHLICH' },
];
function renderTiles(){
  const box = document.getElementById('tiles');
  box.innerHTML = TILES.filter(t => (!t.only || t.only === MY_ID) && (!t.campagne || INDISPOS_OUVERTE) && (!t.liberal || MY_LIBERAL)).map(t => {
    const soon = t.ready ? '' : ' soon';
    const tag  = t.ready ? '' : '<span class="badge-soon">Bientôt</span>';
    const arrow = t.ready ? '<div class="tile-arrow">Ouvrir <i data-lucide="arrow-right" style="width:15px;height:15px"></i></div>' : '';
    const inner =
      tag +
      '<div class="tile-ico'+(t.tint?' '+t.tint:'')+'"><i data-lucide="'+t.icon+'"></i></div>' +
      '<div class="tile-title">'+esc(t.title)+'</div>' +
      '<div class="tile-sub">'+esc(String(t.sub).replace(' {AN}', INDISPOS_YEAR ? (' pour ' + INDISPOS_YEAR) : ''))+'</div>' +
      arrow;
    // Tuile a deux destinations : la face reste identique aux autres, les deux
    // moitiés vivent dessous et n'apparaissent qu'au clic.
    if (t.ready && t.split) {
      const moities = t.split.map(h =>
        '<a class="split-half" href="'+h.href+'">'
        + '<div class="sh-t">'+esc(h.t)+'</div>'
        + '<div class="sh-s">'+esc(h.s)+'</div></a>').join('');
      return '<div class="tile split" id="tile-'+t.key+'">'
        + '<div class="split-face" onclick="splitOpen(\''+t.key+'\')">'+inner+'</div>'
        + '<div class="split-halves">'+moities+'</div>'
        + '<button class="split-back" onclick="splitClose(\''+t.key+'\')">Fermer</button>'
        + '</div>';
    }
    if (t.ready && t.href) return '<a class="tile" href="'+t.href+'">'+inner+'</a>';
    if (t.ready && t.view) return '<div class="tile clickable" onclick="openView(\''+t.view+'\')">'+inner+'</div>';
    return '<div class="tile'+soon+'">'+inner+'</div>';
  }).join('');
  if(window.lucide) lucide.createIcons();
}

function showPortal(){
  document.getElementById('viewAuthOverlay').style.display = 'none';
  document.getElementById('portal').style.display = 'block';
  renderTiles();

  route();
}

// ── MES GARDES (perso — MAR connecté) ──
let MY_GARDES = null;          // [{date:'YYYY-MM-DD', type:'G'|'G2'}] triées
let _mgLoading = false;
const _planCache = {};         // year -> planning JSON (mémoire)

// (perf) Année active : UNE seule promesse partagée (loadMyGardes + loadMyConges),
// pré-alimentée par la réponse du login quand elle contient l'année.
let _activeYearP = null;
function seedActiveYear(y){ if(y) _activeYearP = Promise.resolve(Number(y)); }
function getActiveYearOnce(){
  if(_activeYearP) return _activeYearP;
  _activeYearP = apiPost({action:'getActiveYear'})
    .then(function(r){ return (r && r.success && r.year) ? Number(r.year) : new Date().getFullYear(); })
    .catch(function(){ _activeYearP = null; return new Date().getFullYear(); });
  return _activeYearP;
}

// (perf) Cache sessionStorage du planning, clé partagée avec index.html ({p, a, t}).
// Le dashboard ne lit/écrit que p ; il préserve a pour ne pas écraser le cache d'index.
function _ssPlanGet(year){
  try{ const c=JSON.parse(sessionStorage.getItem('chpgPlan:'+year)); return (c&&c.p)?c:null; }catch(e){ return null; }
}
function _ssPlanSet(year, planning){
  try{
    const prev=_ssPlanGet(year)||{};
    sessionStorage.setItem('chpgPlan:'+year, JSON.stringify({p:planning, a:prev.a, t:Date.now()}));
  }catch(e){}
}
async function _refreshPlanSilently(year){
  try{
    const r=await apiPost({action:'getPlanningJson', year});
    if(r && r.success && r.planning){
      const changed = JSON.stringify(r.planning)!==JSON.stringify(_planCache[year]||null);
      _planCache[year]=r.planning; _ssPlanSet(year, r.planning);
      if(changed && MY_ID){
        // recalcul silencieux du bandeau « prochaine garde »
        const today=_todayStr();
        let list=_extractMyGardes(r.planning, today);
        MY_GARDES=list.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
        renderMyGardesHero();
      }
    }
  }catch(e){ /* silencieux */ }
}

function _todayStr(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function _daysUntil(dateStr){ const t=new Date(_todayStr()+'T00:00:00'), d=new Date(dateStr+'T00:00:00'); return Math.round((d-t)/86400000); }
function _mgCap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

async function _fetchPlanning(year){
  if(_planCache[year]) return _planCache[year];
  const c=_ssPlanGet(year);                       // (perf) cache de la visite précédente
  if(c){ _planCache[year]=c.p; _refreshPlanSilently(year); return c.p; }
  const r = await apiPost({action:'getPlanningJson', year});
  if(r && r.success && r.planning){ _planCache[year]=r.planning; _ssPlanSet(year, r.planning); return r.planning; }
  return null;
}
function _extractMyGardes(planning, today){
  const out=[];
  if(!planning || !planning.months) return out;
  planning.months.forEach(function(m){
    const doc=(m.doctors||[]).find(function(d){ return d.id===MY_ID; });
    if(!doc || !doc.days) return;
    for(let i=0;i<doc.days.length;i++){
      const st=(doc.days[i]||{}).status;
      if((st==='G'||st==='G2') && m.days[i] && m.days[i].date>=today) out.push({date:m.days[i].date, type:st});
    }
  });
  return out;
}
async function loadMyGardes(){
  const hero=document.getElementById('myGardesHero');
  if(!MY_ID){ if(hero) hero.style.display='none'; return; }   // admin → pas de bandeau
  if(hero){ hero.style.display='flex'; hero.classList.add('loading'); }
  if(_mgLoading) return;
  _mgLoading=true;
  try{
    const today=_todayStr();
    let year=new Date().getFullYear();
    try{ year = await getActiveYearOnce(); }catch(e){}
    let list=_extractMyGardes(await _fetchPlanning(year), today);
    if(new Date().getMonth()>=9){   // dès octobre : transition déc.→janv. (N+1 silencieux)
      try{ list=list.concat(_extractMyGardes(await _fetchPlanning(year+1), today)); }catch(e){}
    }
    list.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });

    if(sub) sub.textContent='Réessayez plus tard';

  }

const CONGE_CODE_TO_CAT = { A:'vac', V:'vac', F:'form', TP:'tp', R:'recup', CL:'cl' };  // A (2026) et V (2027+) = vacances
const CAT_META = {
  vac:   { label:'Vacances',      bg:'#EEF4FB', fg:'#1D6FB8' },
  form:  { label:'Formation',     bg:'#FDF3E3', fg:'#B45309' },
  tp:    { label:'Temps partiel', bg:'#FEF3C7', fg:'#92400E' },
  recup: { label:'Récupération',  bg:'#E7F6F3', fg:'#0F766E' },
  cl:    { label:'Congé long',    bg:'#F3E8FF', fg:'#7C3AED' }
};
const CAT_ORDER = ['vac','form','tp','recup','cl'];
let MY_CONGES = null;   // { days:[{date,type}], periods:[{type,start,end,n}], counts:{} }

function _extractMyConges(planning, today){
  const out=[];
  if(!planning || !planning.months) return out;
  planning.months.forEach(function(m){
    const doc=(m.doctors||[]).find(function(d){ return d.id===MY_ID; });
    if(!doc || !doc.days) return;
    for(let i=0;i<doc.days.length;i++){
      const st=(doc.days[i]||{}).status;
      if(CONGE_CODE_TO_CAT[st] && m.days[i] && m.days[i].date>=today) out.push({date:m.days[i].date, cat:CONGE_CODE_TO_CAT[st]});
    }
  });
  return out;
}
function _daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function _buildConges(days){
  days.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
  const periods=[], counts={};
  days.forEach(function(d){
    counts[d.cat]=(counts[d.cat]||0)+1;
    const last=periods[periods.length-1];
    if(last && last.cat===d.cat && _daysBetween(last.end, d.date)<=3){ last.end=d.date; last.n++; }
    else { periods.push({cat:d.cat, start:d.date, end:d.date, n:1}); }
  });
  return { days:days, periods:periods, counts:counts };
}
async function loadMyConges(){
  const today=_todayStr();
  let year=new Date().getFullYear();
  try{ year = await getActiveYearOnce(); }catch(e){}
  let days=_extractMyConges(await _fetchPlanning(year), today);
  if(new Date().getMonth()>=9){ try{ days=days.concat(_extractMyConges(await _fetchPlanning(year+1), today)); }catch(e){} }
  MY_CONGES=_buildConges(days);
}
function openMesConges(){
  document.getElementById('tilesView').style.display='none';
  document.getElementById('mesCongesView').style.display='block';
  if(MY_CONGES===null){
    document.getElementById('mesCongesBody').innerHTML='<div class="topos-loading">Chargement…</div>';
    document.getElementById('mesCongesCount').textContent='';
    loadMyConges().then(renderMesConges);
    return;
  }
  renderMesConges();
}
function renderMesConges(){
  const box=document.getElementById('mesCongesBody'), cnt=document.getElementById('mesCongesCount');
  if(!MY_CONGES || !MY_CONGES.days.length){
    if(cnt) cnt.textContent='';
    box.innerHTML='<div class="topos-empty">Aucun congé à venir.<br><span>Vacances, formation, TP, récup et congés longs apparaîtront ici.</span></div>';
    return;
  }
  const total=MY_CONGES.days.length;
  if(cnt) cnt.textContent = total+(total>1?' jours à venir':' jour à venir');
  const order=CAT_ORDER;
  let chips='<div class="cg-counts">';
  order.forEach(function(t){
    const n=MY_CONGES.counts[t]||0; if(!n) return;
    const c=CAT_META[t];
    chips+='<span class="cg-count" style="background:'+c.bg+';color:'+c.fg+'"><span class="cg-n">'+n+'</span> '+c.label+' <span class="cg-u">j</span></span>';
  });
  chips+='</div>';
  let list='<div class="cg-list">';
  MY_CONGES.periods.forEach(function(p){
    const c=CAT_META[p.cat], s=staffDateParts(p.start), e=staffDateParts(p.end);
    const range = (p.start===p.end)
      ? (_mgCap(s.dow)+' '+s.dnum+' '+s.month)
      : (_mgCap(s.dow)+' '+s.dnum+' '+s.month+' → '+_mgCap(e.dow)+' '+e.dnum+' '+e.month);
    list+='<div class="cg-item">'
      + '<span class="cg-tag" style="background:'+c.bg+';color:'+c.fg+'">'+c.label+'</span>'
      + '<span class="cg-range">'+range+'</span>'
      + '<span class="cg-days">'+p.n+' j</span>'
      + '</div>';
  });
  list+='</div>';
  box.innerHTML=chips+list;
}

let VEILLE_ITEMS = [];
let V_FILTER = 'unread';   // unread | all | star
let V_SOURCE = '';
let V_THEME  = '';
let V_SORT   = 'recent';   // recent | relevance
let V_SEARCH = '';
let V_SEEN   = '';         // dernière visite (yyyy-MM-dd) → badge "nouveau"

// Type d'article : rang pour le tri pertinence + libellé court FR pour le badge.
const PUBTYPE_RANK = { 'Meta-Analysis':1, 'Systematic Review':2, 'Randomized Controlled Trial':3, 'Practice Guideline':4, 'Guideline':5, 'Review':6 };
const PUBTYPE_FR   = { 'Meta-Analysis':'Méta-analyse', 'Systematic Review':'Revue systématique', 'Randomized Controlled Trial':'Essai randomisé', 'Practice Guideline':'Recommandation', 'Guideline':'Recommandation', 'Review':'Mise au point' };

function setVFilter(f, el){

  document.querySelectorAll('#vfilter button').forEach(function(b){ b.classList.toggle('on', b===el); });
  renderVeille();
}
function onVSource(v){ V_SOURCE=v; renderVeille(); }
function onVTheme(v){ V_THEME=v; renderVeille(); }
function populateThemeSelect(){
  const sel=document.getElementById('vThemeSel'); if(!sel) return;
  const set={}; VEILLE_ITEMS.forEach(function(it){ (it.themes||[]).forEach(function(t){ set[t]=true; }); });
  const list=Object.keys(set).sort(function(a,b){ return a.localeCompare(b,'fr'); });
  sel.innerHTML='<option value="">Tous thèmes</option>'+list.map(function(t){
    return '<option value="'+esc(t)+'"'+(t===V_THEME?' selected':'')+'>'+esc(t)+'</option>';
  }).join('');
}
function onVSort(v){ V_SORT=v; renderVeille(); }
function onVSearch(v){ V_SEARCH=String(v||'').trim().toLowerCase(); renderVeille(); }

function _vMatch(it){
  if(V_FILTER==='unread' && it.lu) return false;
  if(V_FILTER==='star'   && !it.star) return false;
  if(V_SOURCE && it.source!==V_SOURCE) return false;
  if(V_THEME && (!it.themes || it.themes.indexOf(V_THEME)===-1)) return false;
  if(V_SEARCH){
    const hay=(it.titre+' '+it.auteurs+' '+it.revue).toLowerCase();
    if(hay.indexOf(V_SEARCH)===-1) return false;
  }
  return true;
}

function renderVeille(){
  const box=document.getElementById('veilleList');
  const unread=VEILLE_ITEMS.filter(function(i){return !i.lu;}).length;
  const shown=VEILLE_ITEMS.filter(_vMatch);
  document.getElementById('veilleCount').textContent =
    VEILLE_ITEMS.length ? (shown.length+' affichés · '+unread+' non lus / '+VEILLE_ITEMS.length+' total') : '';
  if(!VEILLE_ITEMS.length){
    box.innerHTML='<div class="topos-empty">Aucun article pour l\'instant.<br><span>Le scan PubMed tourne chaque lundi ; l\'onglet VEILLE se remplit tout seul.</span></div>';
    return;
  }
  if(!shown.length){ box.innerHTML='<div class="topos-empty">Rien à afficher avec ce filtre.</div>'; return; }
  shown.sort(function(a,b){
    if(V_SORT==='relevance'){
      const ra=_ptRank(a), rb=_ptRank(b);
      if(ra!==rb) return ra-rb;
    }
    return a.date<b.date?1:(a.date>b.date?-1:0);
  });
  box.innerHTML = shown.map(function(it){
    const isNew = V_SEEN && it.ajoute && it.ajoute>V_SEEN;
    const srcBadge = it.source==='THEME'
      ? '<span class="vc-badge theme">Thème</span>'
      : (it.source==='GENERAL'
          ? '<span class="vc-badge general">Généraliste</span>'
          : '<span class="vc-badge revue">Revue spécialisée</span>');
    const ptBadge = PUBTYPE_FR[it.pubtype] ? '<span class="vc-badge pubtype">'+PUBTYPE_FR[it.pubtype]+'</span>' : '';
    const right = (it.score!=null?'<span class="vc-score">'+it.score+'</span>':'')
                + '<span class="vc-date">'+fmtDate(it.date)+'</span>';
    const pub='https://pubmed.ncbi.nlm.nih.gov/'+encodeURIComponent(it.pmid)+'/';
    return '<div class="veille-card'+(it.lu?'':' unread')+'">'
      + '<div class="vc-top">'+srcBadge+ptBadge+(isNew?'<span class="vc-badge new">nouveau</span>':'')
        + '<span class="vc-right">'+right+'</span></div>'
      + '<a class="vc-title" href="'+pub+'" target="_blank" rel="noopener">'+esc(it.titre)+'</a>'
      + (it.resume?'<div class="vc-resume">'+esc(it.resume)+'</div>':'')
      + (it.revue?'<div class="vc-journal">'+esc(it.revue)+'</div>':'')
      + (it.themes&&it.themes.length?'<div class="vc-themes">'+it.themes.map(esc).join(' · ')+'</div>':'')
      + (it.auteurs?'<div class="vc-authors">'+esc(it.auteurs)+'</div>':'')
      + '<div class="vc-actions">'
        + '<button class="vc-act'+(it.lu?' on':'')+'" onclick="toggleV(\''+it.pmid+'\',\'lu\')">'+(it.lu?'✓ Lu':'Marquer lu')+'</button>'
        + '<button class="vc-act star'+(it.star?' on':'')+'" onclick="toggleV(\''+it.pmid+'\',\'star\')">'+(it.star?'★':'☆')+'</button>'
        + '<a class="vc-act" href="'+pub+'" target="_blank" rel="noopener">PubMed</a>'
        + (it.doi?'<a class="vc-act" href="https://doi.org/'+esc(it.doi)+'" target="_blank" rel="noopener">DOI</a>':'')
      + '</div></div>';
  }).join('');
}

function _b64ToBlob(b64, mime){
  const bin=atob(b64), len=bin.length, bytes=new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes], {type: mime||'application/pdf'});
}
async function openDoc(id, el, action){
  action = action || 'getTopo';
  // Ouvrir l'onglet TOUT DE SUITE (dans le geste utilisateur) → évite le
  // blocage popup ; le contenu y est injecté après réception du flux GAS.
  const w = window.open('', '_blank');
  if(el) el.classList.add('loading');
  try{
    const r = await apiPost({action:action, id:id});
    if(!(r && r.success)){ if(w) w.close(); alert((r&&r.error)||'Ouverture impossible'); return; }
    const url = URL.createObjectURL(_b64ToBlob(r.dataB64, r.mimeType));
    if(w){ w.location.href = url; }
    else {
      const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener';
      document.body.appendChild(a); a.click(); a.remove();
    }
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 120000);
  }catch(e){ if(w) w.close(); alert('Erreur réseau — réessayez.'); }
  finally{ if(el) el.classList.remove('loading'); }
}

// ── VUE PROTOCOLES ──
function _norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
let _protoGroups=null;
async function openProtocoles(){
  document.getElementById('tilesView').style.display='none';
  document.getElementById('protocolesView').style.display='block';
  document.getElementById('protocolesCount').textContent='';
  document.querySelector('.protos-search').style.display='none';
  const box=document.getElementById('protocolesList');
  box.innerHTML='<div class="topos-loading">Chargement…</div>';
  try{
    const r=await apiPost({action:'listProtocoles'});
    if(r && r.success){ _protoGroups=r.groups; renderProtocoles(r,''); }
    else { box.innerHTML='<div class="topos-empty">'+esc((r&&r.error)||'Erreur de chargement')+'</div>'; }
  }catch(e){ box.innerHTML='<div class="topos-empty">Erreur réseau — réessayez.</div>'; }
}
function _countProtos(g){ return (g||[]).reduce(function(n,x){ return n+x.protocoles.length; },0); }
function onProtoSearch(q){ renderProtocoles({ count:_countProtos(_protoGroups), groups:_protoGroups }, q); }
function renderProtocoles(data, q){
  q=_norm(q||'');
  document.getElementById('protocolesCount').textContent = data.count ? (data.count + (data.count>1?' protocoles':' protocole')) : '';
  document.querySelector('.protos-search').style.display = (data.count>8) ? 'block' : 'none';
  const box=document.getElementById('protocolesList');
  if(!data.groups || !data.groups.length){
    box.innerHTML='<div class="topos-empty">Aucun protocole pour l\'instant.<br><span>Range tes PDF dans le dossier Drive : un sous-dossier par spécialité, et au besoin un sous-sous-dossier par thème.</span></div>';
    return;
  }
  let html='';
  const searching = !!q;
  data.groups.forEach(function(g){
    const protos = q ? g.protocoles.filter(function(p){ return _norm(p.title).indexOf(q)>=0 || _norm(g.specialite).indexOf(q)>=0; }) : g.protocoles;
    if(!protos.length) return;
    html += '<div class="proto-group'+(searching?' open':'')+'">'
      + '<button type="button" class="proto-spec" onclick="this.parentNode.classList.toggle(\'open\')">'
      + '<span class="chev"><i data-lucide="chevron-right"></i></span>'
      + '<span class="spec-name">'+esc(g.specialite)+'</span>'
      + '<span class="count">'+protos.length+'</span></button>';
    html += '<div class="proto-docs">' + protos.map(function(p){
      return '<div class="doc-row" onclick="openDoc(\''+p.id+'\', this, \'getProtocole\')">'
        + '<i data-lucide="file-text"></i><span class="doc-title">'+esc(p.title)+'</span>'
        + '<span class="doc-size">'+fmtSize(p.size)+'</span></div>';
    }).join('') + '</div>';
    html += '</div>';
  });
  box.innerHTML = html || '<div class="topos-empty">Aucun résultat.</div>';
  if(window.lucide) lucide.createIcons();
}

// ── VUE ANNUAIRE ──
let _annu=null;
function _ini(name){ return String(name||'').trim().split(/\s+/).map(function(w){ return w[0]||''; }).slice(0,2).join('').toUpperCase(); }
function _telLink(num){ const clean=String(num).replace(/[^\d+]/g,''); return clean ? '<a class="annu-num" href="tel:'+esc(clean)+'">'+esc(num)+'</a>' : ''; }
async function openAnnuaire(){
  document.getElementById('tilesView').style.display='none';
  document.getElementById('annuaireView').style.display='block';
  document.querySelector('.annu-search').style.display='none';
  const box=document.getElementById('annuaireList');
  box.innerHTML='<div class="topos-loading">Chargement…</div>';
  try{
    const r=await apiPost({action:'listAnnuaire'});
    if(r && r.success){ _annu=r; renderAnnuaire(r,''); }
    else { box.innerHTML='<div class="topos-empty">'+esc((r&&r.error)||'Erreur de chargement')+'</div>'; }
  }catch(e){ box.innerHTML='<div class="topos-empty">Erreur réseau — réessayez.</div>'; }
}
function onAnnuSearch(q){ if(_annu) renderAnnuaire(_annu, q); }
function renderAnnuaire(data, q){
  q=_norm(q||'');
  const box=document.getElementById('annuaireList');
  const total=(data.equipe?data.equipe.length:0)+(data.categories||[]).reduce(function(n,c){ return n+c.entries.length; },0);
  document.querySelector('.annu-search').style.display = (total>12) ? 'block' : 'none';
  let html='';
  const eq = q ? (data.equipe||[]).filter(function(m){ return _norm(m.name).indexOf(q)>=0 || _norm(m.dect).indexOf(q)>=0; }) : (data.equipe||[]);
  if(eq.length){
    html += '<div class="annu-cat">Équipe MAR</div><div class="annu-team">';
    html += eq.map(function(m){
      const dect = m.dect ? '<span class="team-dect">DECT '+_telLink(m.dect)+'</span>' : '<span class="team-dect none">DECT —</span>';
      return '<div class="team-card"><div class="team-ava">'+esc(m.initials||_ini(m.name))+'</div>'
        + '<div class="team-body"><div class="team-name">'+esc(m.name)+'</div>'+dect+'</div></div>';
    }).join('');
    html += '</div>';
  }
  (data.categories||[]).forEach(function(c){
    const ents = q ? c.entries.filter(function(e){ return _norm(e.libelle).indexOf(q)>=0 || _norm(e.numero).indexOf(q)>=0 || _norm(e.info).indexOf(q)>=0 || _norm(c.categorie).indexOf(q)>=0; }) : c.entries;
    if(!ents.length) return;
    html += '<div class="annu-cat">'+esc(c.categorie)+'</div>';
    html += ents.map(function(e){
      const num = e.numero ? _telLink(e.numero) : '';
      const info = e.info ? '<div class="annu-info">'+esc(e.info)+'</div>' : '';
      return '<div class="annu-row"><div class="annu-lib">'+esc(e.libelle)+info+'</div>'+num+'</div>';
    }).join('');
  });
  box.innerHTML = html || '<div class="topos-empty">Aucune entrée pour l\'instant.<br><span>Remplis l\'onglet ANNUAIRE du Sheet (catégorie, libellé, numéro).</span></div>';
  if(window.lucide) lucide.createIcons();
}

// ── AUTH ──
function _authErr(msg){
  const el = document.getElementById('viewAuthErr');
  el.textContent = msg; el.style.display='block';
  setTimeout(()=> el.style.display='none', 4000);
}
async function viewLogin(){
  const code = document.getElementById('viewAuthInput').value.trim().toUpperCase();
  if(!code) return;
  const btn = document.getElementById('viewAuthBtn');
  btn.disabled = true; btn.textContent = 'Vérification…';
  try{
    VIEW_CODE = code;
    const r = await apiPost({action:'login'});
    if(r && r.success){
      try{ sessionStorage.setItem('chpgViewCode', code); }catch(e){}
      seedActiveYear(r.year);   // (perf) évite un getActiveYear ultérieur
      applyUserBadge(r);
      showPortal();
    } else {
      VIEW_CODE='';
      _authErr(r && r.error ? r.error : 'Code incorrect');
    }
  } catch(e){ VIEW_CODE=''; _authErr('Erreur réseau — réessayez'); }
  btn.disabled = false; btn.textContent = 'Accéder →';
}
async function viewAutoLogin(){
  let saved=''; try{ saved = sessionStorage.getItem('chpgViewCode')||''; }catch(e){}
  if(!saved) return; // pas de code en cache → écran de connexion affiché
  // Affichage optimiste : le code étant en cache, on montre l'interface tout de suite
  // et on revalide en arrière-plan — plus de clignotement de la page d'authentification.
  VIEW_CODE = saved; showPortal();
  try{
    const r = await apiPost({action:'login'});
    if(r && r.success){ seedActiveYear(r.year); applyUserBadge(r); showPortal(); }
    else {
      VIEW_CODE=''; try{ sessionStorage.removeItem('chpgViewCode'); }catch(e){}
      document.getElementById('viewAuthOverlay').style.display='flex';
      document.getElementById('portal').style.display='none';
    }
  } catch(e){ /* réseau indisponible : on conserve l'affichage optimiste */ }
}
document.getElementById('viewAuthInput').addEventListener('keydown', e => { if(e.key==='Enter') viewLogin(); });

if(window.lucide) lucide.createIcons();
window.addEventListener('hashchange', route);
viewAutoLogin();

// ── PWA : service worker (cache des assets ; API/HTML/.json jamais interceptés) ──
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
