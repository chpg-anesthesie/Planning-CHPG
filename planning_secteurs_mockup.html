<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Planning Admin — Cases flashantes — CHPG Monaco</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --red:    #CE1126;
  --ink:    #0F172A;
  --ink-2:  #334155;
  --ink-3:  #64748B;
  --ink-4:  #94A3B8;
  --line:   #E2E8F0;
  --ll:     #F1F5F9;
  --bg:     #F8FAFC;
  --white:  #FFFFFF;
  --radius: 12px;
  --mono:   'DM Mono', monospace;
  --sh:     0 1px 3px rgba(0,0,0,.05);
  --sh-lg:  0 16px 48px rgba(0,0,0,.18);

  /* secteurs */
  --vis-bg:#DBEAFE;  --vis-fg:#1D4ED8;  --vis-brd:#93C5FD;
  --end-bg:#DCFCE7;  --end-fg:#166534;  --end-brd:#86EFAC;
  --orl-bg:#FEF3C7;  --orl-fg:#92400E;  --orl-brd:#FCD34D;
  --rea-bg:#FEE2E2;  --rea-fg:#991B1B;  --rea-brd:#FCA5A5;
  --ort-bg:#F3E8FF;  --ort-fg:#6B21A8;  --ort-brd:#D8B4FE;
  --ci-bg: #FFEDD5;  --ci-fg: #9A3412;  --ci-brd: #FDBA74;
  --mat-bg:#FCE7F3;  --mat-fg:#9D174D;  --mat-brd:#F9A8D4;
  --ri-bg: #ECFDF5;  --ri-fg: #065F46;  --ri-brd: #6EE7B7;

  /* flash */
  --flash-bg:   #FFF7ED;
  --flash-brd:  #F97316;
  --flash-fg:   #F97316;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased;}

/* ── NAV (simulée) ── */
.nav{background:var(--white);border-bottom:1px solid var(--line);padding:0 24px;display:flex;gap:2px;height:48px;align-items:stretch;}
.nav-tab{display:flex;align-items:center;gap:6px;padding:0 16px;font-size:13px;font-weight:500;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;}
.nav-tab:hover{color:var(--ink);}
.nav-tab.active{color:var(--red);border-bottom-color:var(--red);font-weight:700;}

/* ── SEMAINE TOOLBAR ── */
.week-bar{background:var(--white);border-bottom:1px solid var(--line);padding:0 24px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:80;}
.week-nav-btn{width:30px;height:30px;border:1px solid var(--line);background:var(--white);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .12s;font-family:inherit;}
.week-nav-btn:hover{border-color:var(--red);color:var(--red);}
.week-label{font-size:14px;font-weight:700;color:var(--ink);min-width:200px;}
.flash-badge{display:flex;align-items:center;gap:6px;background:#FFF7ED;border:1px solid #FED7AA;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;color:#C2410C;margin-left:8px;animation:badgePulse 2s ease-in-out infinite;}
@keyframes badgePulse{0%,100%{opacity:1;}50%{opacity:.7;}}
.week-bar-right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.btn-export{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--ink-3);font-family:inherit;transition:all .12s;}
.btn-export:hover{border-color:var(--ink-3);color:var(--ink);}
.btn-validate{border:none;background:var(--red);color:white;border-radius:8px;padding:6px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .12s;}
.btn-validate:hover{opacity:.88;}
.btn-validate.validated{background:#166534;}

/* ── GRILLE ── */
.grid-wrap{padding:20px 24px;}
.grid-table{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh);}

.gh-empty{background:var(--ll);padding:10px 16px;border-bottom:2px solid var(--line);width:110px;}
.gh-day{text-align:center;padding:10px 8px;border-bottom:2px solid var(--line);border-left:1px solid var(--line);background:var(--ll);min-width:120px;}
.gh-day-name{font-size:12px;font-weight:700;color:var(--ink);}
.gh-day-date{font-size:11px;color:var(--ink-4);font-weight:400;margin-top:1px;}

.row-secteur td{border-bottom:1px solid var(--ll);}
.row-secteur:last-child td{border-bottom:none;}
.row-secteur:nth-child(even) .cell-day{background:#FAFBFC;}

.cell-label{padding:10px 16px;vertical-align:middle;}
.sec-pill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid;}

.cell-day{padding:8px 10px;border-left:1px solid var(--line);vertical-align:middle;min-width:120px;background:var(--white);}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}

.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap;}

/* Flash case vide */
.chip-flash{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:26px;border-radius:20px;font-size:15px;
  border:2px dashed var(--flash-brd);background:var(--flash-bg);
  color:var(--flash-fg);cursor:pointer;
  animation:flashPulse 1.3s ease-in-out infinite;
  transition:transform .1s;
}
.chip-flash:hover{transform:scale(1.12);}
@keyframes flashPulse{
  0%,100%{opacity:1;background:var(--flash-bg);}
  50%{opacity:.55;background:#FFEDD5;}
}

/* Garde row */
.row-garde .cell-day{background:linear-gradient(90deg,#F8FAFC 0%,var(--white) 100%);}

/* ── POPUP ── */
.popup-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.popup-box{background:var(--white);border-radius:18px;padding:28px;width:360px;box-shadow:var(--sh-lg);animation:popIn .2s cubic-bezier(.16,1,.3,1);}
@keyframes popIn{from{opacity:0;transform:scale(.94)translateY(8px);}to{opacity:1;transform:scale(1)translateY(0);}}
.popup-title{font-size:16px;font-weight:800;margin-bottom:4px;}
.popup-sub{font-size:12px;color:var(--ink-3);margin-bottom:20px;}
.popup-group{margin-bottom:16px;}
.popup-group-label{font-size:10px;font-weight:700;color:var(--ink-4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.popup-mars{display:flex;gap:8px;flex-wrap:wrap;}
.popup-mar-btn{padding:8px 16px;border-radius:10px;border:1.5px solid transparent;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit;transition:transform .1s,box-shadow .1s;}
.popup-mar-btn:hover{transform:scale(1.06);box-shadow:0 4px 14px rgba(0,0,0,.12);}
.popup-footer{margin-top:20px;display:flex;justify-content:space-between;align-items:center;}
.btn-laisser-vide{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:7px 16px;cursor:pointer;font-size:13px;color:var(--ink-3);font-family:inherit;transition:all .12s;}
.btn-laisser-vide:hover{border-color:var(--ink-3);}

/* ── STATUS CHIP pour gardes ── */
.chip-g{background:var(--ink);color:white;border-color:var(--ink);}
.chip-g2{background:var(--ink-2);color:white;border-color:var(--ink-2);}
.chip-rg{background:var(--ll);color:var(--ink-3);border-color:var(--line);}
.chip-v{background:#FEF9C3;color:#854D0E;border-color:#FDE047;}
.chip-r{background:#DCFCE7;color:#166534;border-color:#86EFAC;}

/* ── SEMAINE VALIDÉE ── */
.validated-banner{background:var(--ok-bg,#DCFCE7);border:1px solid #86EFAC;border-radius:10px;padding:10px 16px;margin:16px 24px 0;font-size:13px;font-weight:600;color:#166534;display:none;}
</style>
</head>
<body>

<!-- NAV simulée -->
<div class="nav">
  <div class="nav-tab">🏠 Accueil</div>
  <div class="nav-tab active">📅 Planning</div>
  <div class="nav-tab">👥 Équipe</div>
  <div class="nav-tab">📋 Affectations</div>
  <div class="nav-tab">📊 Équité</div>
</div>

<!-- SEMAINE TOOLBAR -->
<div class="week-bar">
  <button class="week-nav-btn" onclick="prevWeek()">←</button>
  <div class="week-label" id="weekLabel">Semaine 24 — 9 au 13 juin 2026</div>
  <button class="week-nav-btn" onclick="nextWeek()">→</button>
  <div class="flash-badge" id="flashBadge">⚠️ <span id="flashCount">0</span> case<span id="flashPlural">s</span> à pourvoir</div>
  <div class="week-bar-right">
    <button class="btn-export">📊 Exporter Excel</button>
    <button class="btn-validate" id="btnValidate" onclick="validerSemaine()">✅ Valider la semaine</button>
  </div>
</div>

<div class="validated-banner" id="validatedBanner">✅ Semaine validée — publiée sur index.html</div>

<!-- GRILLE -->
<div class="grid-wrap">
  <table class="grid-table" id="planningTable"></table>
</div>

<!-- POPUP -->
<div class="popup-overlay" id="popupOverlay" style="display:none;" onclick="closePopup(event)">
  <div class="popup-box" onclick="event.stopPropagation()">
    <div class="popup-title" id="popupTitle">Affecter un MAR</div>
    <div class="popup-sub" id="popupSub">—</div>
    <div id="popupGroups"></div>
    <div class="popup-footer">
      <div style="font-size:11px;color:var(--ink-4);" id="popupHint"></div>
      <button class="btn-laisser-vide" onclick="laisserVide()">Laisser vide</button>
    </div>
  </div>
</div>

<script>
// ── DONNÉES DE DÉMO ──────────────────────────────────────────────────
const JOURS_LABELS = ['Lun','Mar','Mer','Jeu','Ven'];
const DATES_LABELS = ['09/06','10/06','11/06','12/06','13/06'];

const SECTEUR_META = {
  GARDES: {label:'Gardes',    bg:'#1E293B', fg:'#fff',   brd:'#1E293B'},
  VIS:    {label:'VIS',       bg:'var(--vis-bg)',  fg:'var(--vis-fg)',  brd:'var(--vis-brd)'},
  END:    {label:'END',       bg:'var(--end-bg)',  fg:'var(--end-fg)',  brd:'var(--end-brd)'},
  ORL:    {label:'ORL',       bg:'var(--orl-bg)',  fg:'var(--orl-fg)',  brd:'var(--orl-brd)'},
  REA:    {label:'REA',       bg:'var(--rea-bg)',  fg:'var(--rea-fg)',  brd:'var(--rea-brd)'},
  ORT:    {label:'ORT',       bg:'var(--ort-bg)',  fg:'var(--ort-fg)',  brd:'var(--ort-brd)'},
  CI:     {label:'CI',        bg:'var(--ci-bg)',   fg:'var(--ci-fg)',   brd:'var(--ci-brd)'},
  MAT:    {label:'MAT',       bg:'var(--mat-bg)',  fg:'var(--mat-fg)',  brd:'var(--mat-brd)'},
};

// Planning initial : secteur → jour[0..4] → liste de slots
// null = case vide qui flashe
let planning = {
  GARDES: [
    [{initials:'NO',type:'G'},{initials:'WS',type:'G2'}],
    [{initials:'RW',type:'G'},{initials:'AFR',type:'G2'}],
    [{initials:'SA',type:'G'},{initials:'JC',type:'G2'}],
    [{initials:'NO',type:'G'},{initials:'WS',type:'G2'}],
    [{initials:'LL',type:'G'},{initials:'GA',type:'G2'}],
  ],
  VIS:  [ ['AFR','SA','GA','JC'], ['AFR','SA','GA',null], ['AFR','SA','GA','JC'], ['AFR','SA',null,null], ['AFR','SA','GA','JC'] ],
  END:  [ ['RM','NP','FZ'],       ['RM','NP','FZ'],        ['RM','NP',null],       ['RM','NP','FZ'],       ['RM','NP','FZ']       ],
  ORL:  [ ['SG','LB'],            ['SG','LB'],              ['SG','LB'],            ['SG',null],             ['SG','LB']            ],
  REA:  [ ['LUL','LL','MS'],      ['LUL','LL','MS'],        [null,'LL','MS'],        ['LUL','LL','MS'],       ['LUL','LL','MS']      ],
  ORT:  [ ['CS','RW'],            ['CS',null],              ['CS','RW'],            ['CS','RW'],             ['CS','RW']            ],
  CI:   [ ['JPG'],                ['JPG'],                  ['JPG'],                [null],                  ['JPG']                ],
  MAT:  [ ['WS'],                 ['WS'],                   ['WS'],                 ['WS'],                  ['WS']                 ],
};

// MARs disponibles par jour (volants + CTP + R)
const DISPO = {
  0: [{initials:'MB',role:'VOLANT'},{initials:'CS2',role:'VOLANT'},{initials:'RW2',role:'CTP'},{initials:'RM2',role:'R'}],
  1: [{initials:'FZ',role:'VOLANT'},{initials:'MS2',role:'CTP'},{initials:'NS',role:'R'}],
  2: [{initials:'MB',role:'VOLANT'},{initials:'JPG2',role:'CTP'},{initials:'NS',role:'R'}],
  3: [{initials:'MB',role:'VOLANT'},{initials:'FZ2',role:'CTP'}],
  4: [{initials:'MB',role:'VOLANT'},{initials:'RW3',role:'R'}],
};

const ROLE_STYLE = {
  VOLANT: {bg:'#DBEAFE',fg:'#1D4ED8',label:'Volants'},
  CTP:    {bg:'#F3E8FF',fg:'#7C3AED',label:'CTP disponibles'},
  R:      {bg:'#DCFCE7',fg:'#166534',label:'Récup disponibles'},
};

let currentWeek = 24;
let isValidated = false;
let popupContext = null; // {secteur, jourIdx, slotIdx}

// ── RENDU ────────────────────────────────────────────────────────────
function render() {
  // Compter les flash
  let flashTotal = 0;
  Object.entries(planning).forEach(([sec, days]) => {
    if (sec === 'GARDES') return;
    days.forEach(slots => { flashTotal += slots.filter(s => s === null).length; });
  });
  document.getElementById('flashCount').textContent = flashTotal;
  document.getElementById('flashPlural').textContent = flashTotal > 1 ? 's' : '';
  document.getElementById('flashBadge').style.display = flashTotal > 0 ? 'flex' : 'none';

  const table = document.getElementById('planningTable');
  let html = '';

  // En-têtes
  html += '<thead><tr>';
  html += '<th class="gh-empty"></th>';
  JOURS_LABELS.forEach((j, i) => {
    html += `<th class="gh-day">
      <div class="gh-day-name">${j}</div>
      <div class="gh-day-date">${DATES_LABELS[i]}</div>
    </th>`;
  });
  html += '</tr></thead><tbody>';

  // Lignes
  Object.entries(planning).forEach(([sec, days], rowIdx) => {
    const meta = SECTEUR_META[sec] || SECTEUR_META.VIS;
    const isGarde = sec === 'GARDES';
    html += `<tr class="row-secteur${isGarde?' row-garde':''}">`;

    // Label secteur
    html += `<td class="cell-label">
      <span class="sec-pill" style="background:${meta.bg};color:${meta.fg};border-color:${meta.brd};">
        ${meta.label}
      </span>
    </td>`;

    // Jours
    days.forEach((slots, jourIdx) => {
      html += `<td class="cell-day">`;
      html += `<div class="chips">`;

      if (isGarde) {
        // Ligne gardes : chips spéciales G / G2
        slots.forEach(slot => {
          if (!slot) {
            html += `<span class="chip-flash" onclick="openPopup('${sec}',${jourIdx},${slots.indexOf(slot)})">+</span>`;
          } else {
            const chipCls = slot.type === 'G' ? 'chip-g' : 'chip-g2';
            const label = slot.type === 'G' ? `G · ${slot.initials}` : `G2 · ${slot.initials}`;
            html += `<span class="chip ${chipCls}">${label}</span>`;
          }
        });
      } else {
        slots.forEach((slot, slotIdx) => {
          if (slot === null) {
            html += `<span class="chip-flash" onclick="openPopup('${sec}',${jourIdx},${slotIdx})" title="Affecter un MAR">+</span>`;
          } else {
            html += `<span class="chip" style="background:${meta.bg};color:${meta.fg};border-color:${meta.brd};">${slot}</span>`;
          }
        });
      }

      html += `</div></td>`;
    });

    html += '</tr>';
  });

  html += '</tbody>';
  table.innerHTML = html;
}

// ── POPUP ────────────────────────────────────────────────────────────
function openPopup(secteur, jourIdx, slotIdx) {
  popupContext = {secteur, jourIdx, slotIdx};
  const meta = SECTEUR_META[secteur];
  document.getElementById('popupTitle').textContent = 'Affecter un MAR';
  document.getElementById('popupSub').innerHTML =
    `<span style="background:${meta.bg};color:${meta.fg};border:1px solid ${meta.brd};border-radius:10px;padding:2px 8px;font-weight:700;font-size:11px;">${meta.label}</span>
     &nbsp;· ${JOURS_LABELS[jourIdx]} ${DATES_LABELS[jourIdx]}`;

  const dispo = DISPO[jourIdx] || [];
  const groups = ['VOLANT','CTP','R'];
  let html = '';
  groups.forEach(role => {
    const mars = dispo.filter(m => m.role === role);
    if (!mars.length) return;
    const rs = ROLE_STYLE[role];
    html += `<div class="popup-group">
      <div class="popup-group-label">${rs.label}</div>
      <div class="popup-mars">`;
    mars.forEach(m => {
      html += `<button class="popup-mar-btn"
        style="background:${rs.bg};color:${rs.fg};"
        onclick="placeMAR('${m.initials}')">
        ${m.initials}
      </button>`;
    });
    html += `</div></div>`;
  });

  if (!html) html = `<div style="text-align:center;color:var(--ink-4);padding:20px 0;font-size:13px;">Aucun MAR disponible ce jour</div>`;

  document.getElementById('popupGroups').innerHTML = html;
  document.getElementById('popupHint').textContent = `${dispo.length} MAR${dispo.length>1?'s':''} disponible${dispo.length>1?'s':''}`;
  document.getElementById('popupOverlay').style.display = 'flex';
}

function closePopup(e) {
  if (e && e.target !== document.getElementById('popupOverlay')) return;
  document.getElementById('popupOverlay').style.display = 'none';
  popupContext = null;
}

function placeMAR(initials) {
  if (!popupContext) return;
  const {secteur, jourIdx, slotIdx} = popupContext;
  planning[secteur][jourIdx][slotIdx] = initials;
  document.getElementById('popupOverlay').style.display = 'none';
  popupContext = null;
  render();
}

function laisserVide() {
  document.getElementById('popupOverlay').style.display = 'none';
  popupContext = null;
}

// ── NAVIGATION SEMAINE ───────────────────────────────────────────────
function prevWeek() { currentWeek = Math.max(1, currentWeek - 1); updateWeekLabel(); }
function nextWeek() { currentWeek = Math.min(52, currentWeek + 1); updateWeekLabel(); }
function updateWeekLabel() {
  document.getElementById('weekLabel').textContent = `Semaine ${currentWeek} — …`;
}

// ── VALIDATION ───────────────────────────────────────────────────────
function validerSemaine() {
  isValidated = !isValidated;
  const btn = document.getElementById('btnValidate');
  const banner = document.getElementById('validatedBanner');
  if (isValidated) {
    btn.textContent = '↩ Dé-valider';
    btn.className = 'btn-validate validated';
    banner.style.display = 'block';
  } else {
    btn.textContent = '✅ Valider la semaine';
    btn.className = 'btn-validate';
    banner.style.display = 'none';
  }
}

// ── INIT ─────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
